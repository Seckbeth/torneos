document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]");
  if (!f) return;
  e.preventDefault();
  const d = new FormData(f);
  const kind = f.dataset.form;

  if (kind === "playercode") {
    const r = route(); const t = r.t; if (!t) return;
    const p = playerByCode(t, d.get("code"));
    if (!p) return toast("Código no encontrado");
    S.me = S.me || {}; S.me[t.id] = p.id;
    saveDB(); closeModal(); go("#/t/" + t.id); render();
    toast("Hola, " + p.name);
    return;
  }
  if (kind === "create") {
    const pass = String(d.get("adminPass") || "").trim();
    if (pass.length < 4) return toast("La contraseña de organizador necesita al menos 4 caracteres");
    const t = newTournament({
      name: d.get("name"), game: d.get("game"), format: d.get("format"),
      size: d.get("size"), bestOf: d.get("bestOf"), chars: d.get("chars"),
      pools: d.get("pools"), advance: d.get("advance"),
      mode: d.get("mode"), perMatch: d.get("perMatch"), advW: d.get("advW"), advL: d.get("advL"),
      judges: d.get("judges"), adminPass: pass,
      regChar: !!d.get("regChar"), regLevel: !!d.get("regLevel"),
    });
    touch(t);
    go("#/t/" + t.id);
    toast("Torneo creado · jueces y QR en la pestaña Jueces");
    return;
  }
  if (kind === "cfg") {
    S.cfg = { url: String(d.get("url") || "").trim().replace(/\/$/, ""), key: String(d.get("key") || "").trim() };
    saveDB(); toast(S.cfg.url ? "Sincronización guardada" : "Modo local"); pullRemote(true); return;
  }
  const r = route(); const t = r.t;
  if (!t) return;

  if (kind === "edit") {
    const mode = d.get("mode") === "heat" ? "heat" : "duel";
    const perMatch = clamp(+d.get("perMatch") || 4, 2, 8);
    const advW = clamp(+d.get("advW") || 2, 1, perMatch - 1);
    const advL = clamp(d.get("advL") == null ? 0 : +d.get("advL"), 0, Math.max(0, perMatch - advW));
    const format = d.get("format") === "single" ? "single" : "double";
    const changed = mode !== (t.mode || "duel") || perMatch !== (+t.perMatch || 4) || advW !== (+t.advW || 2)
      || advL !== (t.advL == null ? 1 : +t.advL) || format !== (t.format || "double");
    if (changed && t.phase !== "reg" && (Object.keys(t.results || {}).length || Object.keys(t.orders || {}).length)) {
      if (!confirm("Cambiaste el formato y hay partidas jugadas. Se borran los resultados y se rearman las llaves. ¿Seguir?")) return;
      t.results = {}; t.orders = {}; t.phase = "running";
    }
    t.bestOf = +d.get("bestOf") || 3;
    t.mode = mode; t.perMatch = perMatch; t.advW = advW; t.advL = advL; t.format = format;
    t.regFields = { char: !!d.get("regChar"), level: !!d.get("regLevel") };
    if (mode === "heat") { t.poolCount = 0; t.pools = null; t.qualified = null; }
    if (t.phase !== "reg" && t.phase !== "pools") settle(t);
    touch(t); closeModal(); render(); toast("Torneo actualizado");
    return;
  }
  if (kind === "reg") {
    const name = String(d.get("name") || "").trim();
    if (!name) return;
    const rf = regFields(t);
    const pid = uid("p");
    t.players.push({
      id: pid, name,
      char: rf.char ? String(d.get("char") || "").trim() : "",
      level: rf.level ? String(d.get("level") || "").trim() : "",
      token: uid("u") + uid("u"),
      code: (t.id.slice(-2) + pid.slice(-3)).toUpperCase(),
      seed: t.players.length + 1, in: false, createdAt: now(),
    });
    S.me = S.me || {}; S.me[t.id] = pid;
    rememberPerson(name);
    touch(t);
    render();
    toast("Inscripción confirmada · guardá tu link o código");
    return;
  }
  if (kind === "addp") {
    const name = String(d.get("name") || "").trim(); if (!name) return;
    const pid = uid("p");
    t.players.push({
      id: pid, name,
      char: String(d.get("char") || "").trim(),
      token: uid("u") + uid("u"),
      code: (t.id.slice(-2) + pid.slice(-3)).toUpperCase(),
      seed: t.players.length + 1, in: true, createdAt: now(),
    });
    rememberPerson(name);
    touch(t); render(); return;
  }
  if (kind === "addmany") {
    const names = String(d.get("names") || "").split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    if (!names.length) return;
    names.forEach(raw => {
      const name = raw.slice(0, 24);
      const pid = uid("p");
      t.players.push({
        id: pid, name, char: "",
        token: uid("u") + uid("u"),
        code: (t.id.slice(-2) + pid.slice(-3)).toUpperCase(),
        seed: t.players.length + 1, in: true, createdAt: now(),
      });
      rememberPerson(name);
    });
    touch(t); render();
    toast(names.length + (names.length === 1 ? " jugador agregado" : " jugadores agregados"));
    return;
  }
  if (kind === "addjudge") {
    const name = String(d.get("name") || "").trim(); if (!name) return;
    t.judges = t.judges || [];
    const j = { id: uid("j"), name, pin: String(Math.floor(1000 + Math.random() * 9000)), token: uid("k") + uid("k") };
    t.judges.push(j);
    touch(t); render();
    openJudgeQR(t, j);
    return;
  }
  if (kind === "addjudgep") {
    const p = t.players.find(x => x.id === d.get("pid"));
    if (!p) return;
    t.judges = t.judges || [];
    if (t.judges.some(j => j.name === p.name)) return toast("Ya es juez");
    const j = { id: uid("j"), name: p.name, pin: String(Math.floor(1000 + Math.random() * 9000)), token: uid("k") + uid("k") };
    t.judges.push(j);
    touch(t); render();
    openJudgeQR(t, j);
    return;
  }
  if (kind === "chars") {
    t.chars = String(d.get("chars") || "").split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    touch(t); render(); toast("Lista actualizada"); return;
  }
});

/* tras cargar o borrar un resultado: ¿terminó el torneo? */
function settle(t) {
  if (t.mode === "heat") {
    const H = computeHeat(t);
    t.phase = H.champ ? "done" : "running";
    return;
  }
  const { champ } = computeBracket(t);
  t.phase = champ ? "done" : "running";
}

function seedApply(t, shuffle) {  let arr = t.players.slice();
  if (shuffle) arr = arr.sort(() => Math.random() - .5);
  arr.forEach((p, i) => { p.seed = i + 1; });
  touch(t); render(); toast(shuffle ? "Siembra aleatoria" : "Siembra por orden de lista");
}

/* ---------------- ruleta ---------------- */
let spinning = false;
function spin(t) {
  const chars = (t.chars || []).length ? t.chars : ["Ryu", "Ken", "Chun-Li", "Cammy", "Guile", "Juri", "Zangief", "Dhalsim"];
  const el = $("#spin");
  if (!el || spinning) return;
  spinning = true;
  el.className = "spin-name go";
  let i = 0, delay = 45, total = 0;
  const step = () => {
    el.textContent = chars[Math.floor(Math.random() * chars.length)];
    total++;
    if (total > 26) delay *= 1.18;
    if (delay > 320) {
      const win = chars[Math.floor(Math.random() * chars.length)];
      el.textContent = win;
      el.className = "spin-name done flash";
      spinning = false;
      return;
    }
    setTimeout(step, delay);
  };
  step();
}
function assignAll(t) {
  const chars = (t.chars || []).length ? t.chars : ["Ryu", "Ken", "Chun-Li", "Cammy", "Guile", "Juri"];
  const ps = t.players.slice();
  const pool = [];
  while (pool.length < ps.length) pool.push(...chars.slice().sort(() => Math.random() - .5));
  ps.forEach((p, i) => { p.char = pool[i]; });
  touch(t); render(); toast("Personajes asignados");
}

/* ---------------- sync (Supabase REST, opcional) ---------------- */
function cfgOK() { return !!(S.cfg.url && S.cfg.key); }
function headers() {
  return { apikey: S.cfg.key, Authorization: "Bearer " + S.cfg.key, "Content-Type": "application/json" };
}
async function pushRemote(t) {
  if (!cfgOK() || !t) return;
  try {
    await fetch(S.cfg.url + "/rest/v1/tournaments?on_conflict=id", {
      method: "POST",
      headers: Object.assign(headers(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ id: t.id, data: t, updated_at: new Date().toISOString() }]),
    });
  } catch (e) { /* offline: seguimos local */ }
}
let pulling = false;
async function pullRemote(manual) {
  if (!cfgOK() || pulling) return;
  pulling = true;
  try {
    const res = await fetch(S.cfg.url + "/rest/v1/tournaments?select=id,data,updated_at", { headers: headers() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    let changed = false;
    for (const row of rows) {
      const remote = row.data;
      const local = S.t[row.id];
      if (!remote || !remote.id) continue;
      if (remote.deleted) {
        if (local) { delete S.t[row.id]; delete S.owners[row.id]; changed = true; }
        continue;
      }
      if (!local || (remote.updatedAt || 0) > (local.updatedAt || 0)) { S.t[row.id] = remote; changed = true; }
    }
    if (changed) { saveDB(); render(); }
    if (manual) toast("Sincronizado · " + rows.length + " torneos");
  } catch (e) { if (manual) toast("No se pudo sincronizar: " + e.message); }
  finally { pulling = false; }
}
setInterval(() => pullRemote(false), 4000);
window.addEventListener("storage", (e) => { if (e.key === KEY) { S = loadDB(); render(); } });

/* ============================================================
   AUTO-TEST  (#/test)
   ============================================================ */
function renderTest() {
  const out = runTests();
  $("#app").innerHTML = `<h1 style="font-size:1.3rem">Auto-test del motor</h1>
  <div class="card" style="margin-top:.8rem"><pre style="margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace">${esc(out.join("\n"))}</pre></div>`;
}
function runTests() {
  const out = [];
  let pass = 0, fail = 0;
  const ok = (c, msg) => { if (c) { pass++; } else { fail++; out.push("FALLA: " + msg); } };

  for (const size of [4, 8, 16, 32, 64]) {
    for (const format of ["single", "double"]) {
      const t = {
        id: "test", format, size, bestOf: 3, results: {}, players: [],
        chars: [], judges: [],
      };
      const n = format === "single" ? size : size; // lleno
      for (let i = 0; i < n; i++) t.players.push({ id: "p" + i, name: "P" + i, seed: i + 1, in: true, createdAt: i });

      let { B } = computeBracket(t);
      let guard = 0;
      while (guard++ < 5000) {
        const p = playable(B);
        if (!p.length) break;
        const m = p[Math.floor(Math.random() * p.length)];
        t.results[m.id] = Math.random() < .5 ? [3, 0] : [3, 2];
        ({ B } = computeBracket(t));
      }
      const res = computeBracket(t);
      ok(!!res.champ, `${format} ${size}: sin campeón`);
      ok(guard < 5000, `${format} ${size}: no termina`);
      const losses = res.losses;
      if (format === "double") {
        const bad = Object.entries(losses).filter(([, v]) => v > 2);
        ok(!bad.length, `double ${size}: alguien perdió ${bad[0] && bad[0][1]} veces`);
        const champ = res.champ;
        ok((losses[champ] || 0) <= 1, `double ${size}: campeón con 2 derrotas`);
      } else {
        const oneLoss = Object.values(losses).filter(v => v === 1).length;
        ok(oneLoss === size - 1, `single ${size}: eliminados=${oneLoss}, esperado ${size - 1}`);
      }
      const total = Object.values(B.matches).filter(m => m.done && m.a !== BYE && m.b !== BYE).length;
      out.push(`${format.padEnd(6)} ${String(size).padStart(3)} → campeón ${res.champ ? "sí" : "no"}, partidas jugadas ${total}, pendientes ${playable(B).length}`);
    }
  }
  // bracket incompleto (byes)
  for (const n of [3, 5, 6, 11]) {
    const t = { id: "x", format: "double", size: nextPow2(n), bestOf: 3, results: {}, players: [], chars: [], judges: [] };
    for (let i = 0; i < n; i++) t.players.push({ id: "q" + i, name: "Q" + i, seed: i + 1, in: true, createdAt: i });
    let { B } = computeBracket(t);
    let guard = 0;
    while (guard++ < 5000) {
      const p = playable(B); if (!p.length) break;
      const m = p[Math.floor(Math.random() * p.length)];
      t.results[m.id] = [3, 1];
      ({ B } = computeBracket(t));
    }
    const r = computeBracket(t);
    ok(!!r.champ, `byes ${n}: sin campeón`);
    out.push(`byes   ${String(n).padStart(3)} → campeón ${r.champ ? "sí" : "no"}, pendientes ${playable(B).length}`);
  }
  // GF reset
  {
    const t = { id: "g", format: "double", size: 4, bestOf: 3, results: {}, players: [], chars: [], judges: [] };
    for (let i = 0; i < 4; i++) t.players.push({ id: "g" + i, name: "G" + i, seed: i + 1, in: true, createdAt: i });
    let { B } = computeBracket(t);
    let guard = 0;
    while (guard++ < 500) {
      const p = playable(B); if (!p.length) break;
      const m = p[0];
      // forzar que el de losers gane la GF0
      const g = m.id === "GF-0";
      t.results[m.id] = g ? [1, 3] : [3, 0];
      ({ B } = computeBracket(t));
    }
    const r = computeBracket(t);
    ok(!!r.B.matches["GF-1"], "reset: no se creó la segunda final");
    ok(!!r.champ, "reset: sin campeón");
    if (r.B.matches["GF-1"]) ok(r.B.matches["GF-1"].done, "reset: GF-1 sin jugar");
    out.push("grand final reset → " + (r.B.matches["GF-1"] ? "GF-1 jugada" : "no aplicó"));
  }

  // ---- modo por puestos (varios jugadores por partida) ----
  const heatCfgs = [
    { n: 16, K: 4, aW: 2, aL: 1, format: "double" },
    { n: 16, K: 4, aW: 2, aL: 1, format: "single" },
    { n: 11, K: 4, aW: 2, aL: 1, format: "double" },
    { n: 9, K: 3, aW: 1, aL: 1, format: "double" },
    { n: 20, K: 6, aW: 4, aL: 1, format: "double" },
    { n: 7, K: 4, aW: 2, aL: 0, format: "double" },
    { n: 5, K: 4, aW: 3, aL: 1, format: "double" },
    { n: 5, K: 4, aW: 2, aL: 1, format: "single" },
    { n: 2, K: 4, aW: 2, aL: 1, format: "double" },
  ];
  for (const cfg of heatCfgs) {
    const t = {
      id: "h", mode: "heat", perMatch: cfg.K, advW: cfg.aW, advL: cfg.aL, format: cfg.format,
      players: [], orders: {}, chars: [], judges: [], results: {}, phase: "running",
    };
    for (let i = 0; i < cfg.n; i++) t.players.push({ id: "h" + i, name: "H" + i, seed: i + 1, in: true, createdAt: i });
    let H = computeHeat(t);
    let guard = 0;
    while (guard++ < 500) {
      const pend = heatPending(H);
      if (!pend.length) break;
      const m = pend[0];
      // orden aleatorio
      t.orders[m.id] = m.players.slice().sort(() => Math.random() - .5);
      H = computeHeat(t);
    }
    const label = `heat ${cfg.n}/${cfg.K} aW${cfg.aW} ${cfg.format}`;
    ok(guard < 500, `${label}: no termina`);
    ok(!!H.champ, `${label}: sin campeón`);
    // cada jugador aparece exactamente una vez por ronda de ganadores y nadie se repite en un grupo
    let dup = false, missing = false;
    for (const round of H.W) {
      const seen = new Set();
      for (const m of round.matches) {
        if (new Set(m.players).size !== m.players.length) dup = true;
        m.players.forEach(p => seen.add(p));
      }
      if (round.matches.some(m => m.players.length > cfg.K)) dup = true;
    }
    // todos los anotados jugaron al menos una vez
    const played = new Set();
    Object.values(H.all).forEach(m => m.players.forEach(p => played.add(p)));
    if (played.size !== cfg.n) missing = true;
    ok(!dup, `${label}: grupo con jugadores repetidos o de más`);
    ok(!missing, `${label}: ${cfg.n - played.size} jugadores sin partida`);
    out.push(`${label.padEnd(26)} → campeón ${H.champ ? "sí" : "no"}, rondas W ${H.W.length}${cfg.format === "double" ? `, L ${H.L.length}` : ""}, pendientes ${heatPending(H).length}`);
  }

  // no debe haber campeón antes de la gran final (modo fiesta, doble)
  {
    const t = {
      id: "hg", mode: "heat", perMatch: 4, advW: 2, advL: 1, format: "double",
      players: [], orders: {}, chars: [], judges: [], results: {}, phase: "running",
    };
    for (let i = 0; i < 8; i++) t.players.push({ id: "g" + i, name: "G" + i, seed: i + 1, in: true, createdAt: i });
    let H = computeHeat(t);
    let guard = 0;
    while (guard++ < 50) {
      const pend = heatPending(H).filter(m => m.side === "W");
      if (!pend.length) break;
      t.orders[pend[0].id] = pend[0].players.slice();
      H = computeHeat(t);
    }
    ok(!!H.champW, "heat: sin campeón de ganadores");
    ok(!H.champ, "heat: declaró campeón antes de la gran final");
    ok(heatPending(H).length > 0, "heat: no quedan partidas pendientes de perdedores");
    out.push("heat gran final → campeón solo al final: " + (H.champ ? "FALLA" : "OK"));
  }

  // ---- reparto de partidas: primero llenas, la última más chica ----
  {
    const cases = [
      { n: 14, K: 4, want: [4, 4, 4, 2] },
      { n: 13, K: 4, want: [4, 4, 4, 1] },
      { n: 10, K: 4, want: [4, 4, 2] },
      { n: 9, K: 4, want: [4, 4, 1] },
      { n: 8, K: 4, want: [4, 4] },
      { n: 6, K: 4, want: [4, 2] },
      { n: 5, K: 4, want: [4, 1] },
      { n: 3, K: 4, want: [3] },
    ];
    let bad = 0;
    for (const c of cases) {
      const ids = Array.from({ length: c.n }, (_, i) => "x" + i);
      const got = heatChunks(ids, c.K).map(g => g.length);
      if (JSON.stringify(got) !== JSON.stringify(c.want)) {
        bad++;
        ok(false, `heatChunks ${c.n}/${c.K}: ${got.join(",")} != ${c.want.join(",")}`);
      }
    }
    if (!bad) { pass += cases.length; out.push("heatChunks tamaños → OK (4,4,4,2 / 4,4,4,1 / 4,4,2…)"); }
  }

  // ---- perdedores en paralelo ----
  {
    const t = {
      id: "hp", mode: "heat", perMatch: 4, advW: 2, advL: 1, format: "double",
      players: [], orders: {}, chars: [], judges: [], results: {}, phase: "running",
    };
    for (let i = 0; i < 12; i++) t.players.push({ id: "hp" + i, name: "HP" + i, seed: i + 1, in: true, createdAt: i });
    let H = computeHeat(t);
    const w0 = H.W[0].matches;
    if (w0[0]) t.orders[w0[0].id] = w0[0].players.slice();
    if (w0[1]) t.orders[w0[1].id] = w0[1].players.slice();
    H = computeHeat(t);
    ok(H.L.length > 0 && H.L[0].matches.length > 0, "perdedores no se armó en paralelo con ganadores");
    out.push("perdedores en paralelo → " + (H.L.length ? "OK" : "FALLA"));
  }

  // ---- el que baja mientras la ronda de perdedores está pendiente sigue vivo ----
  {
    const t = {
      id: "hw", mode: "heat", perMatch: 4, advW: 2, advL: 1, format: "double",
      players: [], orders: {}, chars: [], judges: [], results: {}, phase: "running",
    };
    for (let i = 0; i < 12; i++) t.players.push({ id: "hw" + i, name: "HW" + i, seed: i + 1, in: true, createdAt: i });
    let H = computeHeat(t);
    H.W[0].matches.forEach(m => { t.orders[m.id] = m.players.slice(); });
    H = computeHeat(t);
    const w1 = H.W[1] && H.W[1].matches[0];
    ok(!!w1, "espera perdedores: no se armó la segunda ronda de ganadores");
    if (w1) {
      const dropPid = w1.players[2];
      t.orders[w1.id] = w1.players.slice();
      H = computeHeat(t);
      ok((H.waiting || []).indexOf(dropPid) >= 0, "espera perdedores: el que baja no quedó esperando");
      ok(aliveOf(t, dropPid, null, H), "espera perdedores: el que espera figura eliminado");
      const my = myStatus(t, dropPid, null, H);
      ok(!my.eliminated && my.waitingL, "espera perdedores: estado del jugador incorrecto");
      out.push("jugador esperando perdedores → " + (my.waitingL && !my.eliminated ? "OK" : "FALLA"));
    }
  }

  // ---- retirado en duelo: la partida pendiente se resuelve sola ----
  {
    const t = { id: "rd", format: "double", size: 8, bestOf: 3, results: {}, players: [], chars: [], judges: [] };
    for (let i = 0; i < 8; i++) t.players.push({ id: "rd" + i, name: "RD" + i, seed: i + 1, in: true, createdAt: i });
    let { B } = computeBracket(t);
    const m0 = playable(B)[0];
    const pid = m0.a, opp = m0.b;
    t.players.find(x => x.id === pid).retired = true;
    let r = computeBracket(t);
    const mm = r.B.matches[m0.id];
    ok(mm && mm.done && mm.winPid === opp, "retiro duelo: no ganó el rival");
    let guard = 0;
    while (guard++ < 500) {
      const pend = playable(r.B);
      if (!pend.length) break;
      pend.forEach(x => { t.results[x.id] = [3, 0]; });
      r = computeBracket(t);
    }
    ok(!!r.champ, "retiro duelo: sin campeón");
    out.push("retiro duelo → " + (r.champ ? "campeón sí" : "campeón no"));
  }

  // ---- retirado en modo fiesta: sale de la partida y el torneo termina ----
  {
    const t = {
      id: "rh", mode: "heat", perMatch: 4, advW: 2, advL: 1, format: "double",
      players: [], orders: {}, chars: [], judges: [], results: {}, phase: "running",
    };
    for (let i = 0; i < 12; i++) t.players.push({ id: "rh" + i, name: "RH" + i, seed: i + 1, in: true, createdAt: i });
    let H = computeHeat(t);
    const m0 = heatPending(H)[0];
    const pid = m0.players[0];
    t.players.find(x => x.id === pid).retired = true;
    H = computeHeat(t);
    const nm = H.all[m0.id];
    ok(nm && nm.players.indexOf(pid) < 0, "retiro fiesta: el retirado sigue en la partida");
    let guard = 0;
    while (guard++ < 500) {
      const pend = heatPending(H);
      if (!pend.length) break;
      pend.forEach(x => { t.orders[x.id] = x.players.slice().reverse(); });
      H = computeHeat(t);
    }
    ok(!!H.champ, "retiro fiesta: sin campeón");
    out.push("retiro fiesta → " + (H.champ ? "campeón sí" : "campeón no"));
  }

  out.push("");
  out.push(`RESULTADO: ${pass} OK · ${fail} fallas`);
  return out;
}

/* ---------------- boot ---------------- */
window.addEventListener("load", () => { render(); pullRemote(false); });
render();
</script>
</body>
