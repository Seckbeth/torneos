<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>Bracket — Gestor de torneos</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#08070c; --panel:#121019; --panel2:#181524; --line:#2a2436;
    --txt:#f3eefc; --dim:#9a92ad; --acc:#ff2e88; --acc2:#22d3ee;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --win:#fb923c; --rad:14px;
  }
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(255,46,136,.14), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(34,211,238,.10), transparent 60%),
      var(--bg);
    color:var(--txt);
    font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc2);text-decoration:none}
  h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}
  .top{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,7,12,.82);backdrop-filter:blur(12px);z-index:40}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem}
  .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#ff7ab0 45%,var(--acc2));box-shadow:0 0 22px rgba(255,46,136,.45)}
  .top .sp{flex:1}
  .wrap{max-width:1180px;margin:0 auto;padding:1.1rem 1rem 4rem}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--rad);padding:1rem}
  .muted{color:var(--dim)}
  .tiny{font-size:.78rem}
  .label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .btn{appearance:none;border:1px solid var(--line);background:#1d1929;color:var(--txt);border-radius:10px;padding:.55rem .9rem;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#3d3450;background:#251f34}
  .btn:active{transform:translateY(1px)}
  .btn.p{background:linear-gradient(135deg,var(--acc),#ff5ca2);border-color:transparent;color:#170a11;box-shadow:0 6px 22px -10px rgba(255,46,136,.9)}
  .btn.p:hover{filter:brightness(1.08)}
  .btn.g{background:transparent}
  .btn.sm{padding:.35rem .6rem;font-size:.78rem;border-radius:8px}
  .btn.danger{color:#ffb4b4;border-color:#4a2530}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  input,select,textarea{font:inherit;background:#0e0c15;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.55rem .7rem;width:100%}
  input:focus,select,textarea:focus{outline:2px solid rgba(34,211,238,.35);outline-offset:-2px}
  .grid{display:grid;gap:.8rem}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:.35rem}
  .badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:#0d2018;background:var(--ok);border-color:transparent}
  .badge.live{color:#1a0710;background:var(--acc);border-color:transparent;animation:pulse 1.6s infinite}
  .badge.warn{color:#2a1d02;background:var(--warn);border-color:transparent}
  @keyframes pulse{50%{opacity:.55}}
  .tabs{display:flex;gap:.35rem;overflow-x:auto;padding:.2rem 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:transparent;border:1px solid transparent;color:var(--dim);padding:.45rem .8rem;border-radius:9px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:#1e1a2b;color:var(--txt);border-color:var(--line)}
  table{width:100%;border-collapse:collapse}
  th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:.5rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.9rem}
  tr:last-child td{border-bottom:0}
  .num{font-variant-numeric:tabular-nums}
  .pmatch{display:grid;grid-template-columns:1fr 22px 22px 1fr;gap:.3rem;align-items:center;background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:.3rem .45rem;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
  .pmatch:hover{border-color:#3d3450;background:#151120}
  .pmatch:disabled{cursor:default;opacity:.9}
  .pmatch .n{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmatch .s{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:.78rem;color:var(--dim)}
  .pmatch .s.w{color:var(--ok)}
  /* bracket estilo mapa */
  .bheadrow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .bsection{margin-top:.8rem}
  .bsection + .bsection{margin-top:1.2rem}
  .bhead{display:flex;align-items:center;gap:.45rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:0 0 .5rem}
  .bdot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block}
  .bdot.w{background:var(--win)} .bdot.l{background:var(--acc2)} .bdot.g{background:var(--acc)}
  .bracket{display:flex;gap:2rem;overflow-x:auto;padding:.4rem .2rem 1rem;align-items:stretch;scrollbar-width:thin}
  .bracket::-webkit-scrollbar{height:8px}
  .bracket::-webkit-scrollbar-thumb{background:#2e2740;border-radius:8px}
  .bracket::-webkit-scrollbar-track{background:transparent}
  .round{display:flex;flex-direction:column;min-width:240px;flex:0 0 auto}
  .round h4{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 .5rem;font-weight:800;white-space:nowrap}
  .round .ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:.75rem;position:relative}
  .round .ms .conn{position:absolute;right:-1rem;width:2px;background:#4a3d63;border-radius:2px;pointer-events:none}
  .round:not(.last) .match::after{content:"";position:absolute;right:-1rem;top:calc(50% - 1px);width:1rem;height:2px;background:#4a3d63;pointer-events:none}
  .round:not(.first) .match::before{content:"";position:absolute;left:-1rem;top:calc(50% - 1px);width:1rem;height:2px;background:#4a3d63;pointer-events:none}
  .bracket.gf{justify-content:center;padding-bottom:.2rem}
  .bracket.gf .match{width:300px;flex:0 0 auto}
  .match{position:relative;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#14111d,#100e17);overflow:hidden;cursor:pointer;transition:.15s;box-shadow:0 6px 18px -16px #000}
  .match:hover{border-color:#4a3d63;transform:translateY(-1px)}
  .match.done{opacity:.9}
  .match.live{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,46,136,.35),0 8px 26px -14px var(--acc)}
  .match.bye{opacity:.72}
  .mhead{display:flex;align-items:center;gap:.4rem;padding:.32rem .5rem;background:rgba(255,255,255,.025);border-bottom:1px solid rgba(255,255,255,.05);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .mno{font-weight:900;color:var(--txt);font-variant-numeric:tabular-nums}
  .mrd{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mfoot{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.25rem .5rem;border-top:1px solid rgba(255,255,255,.05);font-size:.62rem}
  .p{display:flex;align-items:center;gap:.5rem;padding:.48rem .55rem;font-size:.84rem;position:relative}
  .p + .p{border-top:1px solid rgba(255,255,255,.05)}
  .p .s{width:1.15rem;text-align:center;font-weight:900;color:var(--dim);font-size:.75rem;font-variant-numeric:tabular-nums}
  .p .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .p .c{font-size:.65rem;color:var(--dim);max-width:6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p.win{background:linear-gradient(90deg,rgba(251,146,60,.22),rgba(251,146,60,.02));box-shadow:inset 3px 0 0 var(--win)}
  .p.win .s{color:var(--win)}
  .p.lose{opacity:.55}
  .p.bye .n{color:var(--dim);font-style:italic}
  .p.first{background:linear-gradient(90deg,rgba(251,146,60,.25),rgba(251,146,60,.02));box-shadow:inset 3px 0 0 var(--win)}
  .p.first .s{color:var(--win)}
  .p.pass{background:linear-gradient(90deg,rgba(52,211,153,.14),transparent)}
  .p.pass .s{color:var(--ok)}
  .p.drop{background:linear-gradient(90deg,rgba(34,211,238,.12),transparent)}
  .p.drop .s{color:var(--acc2)}
  .p.out{opacity:.5}
  .match.heat .p .s{width:1.3rem}
  .match.heat .p .n{font-size:.82rem}
  /* elegir orden en partidas de varios jugadores */
  .pick{display:flex;align-items:center;gap:.6rem;background:#0f0d16;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
  .pick:hover{border-color:#3d3450;background:#151120}
  .pick.on{border-color:var(--acc);background:rgba(255,46,136,.12)}
  .pickn{width:1.5rem;height:1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;background:#221c31;color:var(--dim);flex:0 0 auto}
  .pick.on .pickn{background:var(--acc);color:#08120f}
  .pickname{flex:1;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--dim);font-size:.78rem;padding:.5rem}
  .modal{position:fixed;inset:0;background:rgba(4,3,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -30px #000}
  .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#221c31;border:1px solid var(--line);padding:.6rem 1rem;border-radius:999px;font-size:.84rem;z-index:200;box-shadow:0 10px 30px -12px #000}
  .spin-name{font-size:clamp(2rem,9vw,4rem);font-weight:900;letter-spacing:-.03em;text-align:center;padding:1.5rem 0;min-height:1.4em}
  .spin-name.go{color:var(--acc2);text-shadow:0 0 30px rgba(34,211,238,.5)}
  .spin-name.done{color:var(--acc);text-shadow:0 0 40px rgba(255,46,136,.5)}
  .flash{animation:flash .5s}
  @keyframes flash{0%{background:rgba(52,211,153,.25)}100%{background:transparent}}
  body.overlay{background:transparent;overflow:hidden}
  body.overlay.solid{background:#0b0910}
  .ov{padding:2vw;display:grid;grid-template-columns:1.35fr .9fr;gap:2vw;height:100vh}
  .ov .main{border:1px solid rgba(255,255,255,.14);border-radius:1.2vw;padding:1.6vw;background:linear-gradient(160deg,rgba(255,46,136,.16),rgba(10,8,16,.82));display:flex;flex-direction:column;justify-content:center;gap:6vh}
  .ov .names{display:flex;align-items:center;justify-content:space-between;gap:1vw}
  .ov .who{font-size:2.6vw;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  .ov .ch{font-size:1.1vw;color:#c9c1da;letter-spacing:.1em;text-transform:uppercase}
  .ov .vs{font-size:1.4vw;color:var(--acc);font-weight:900;letter-spacing:.2em}
  .ov .side{background:rgba(8,7,12,.72);border:1px solid rgba(255,255,255,.1);border-radius:1.2vw;padding:1.2vw;overflow:hidden}
  /* lower third para OBS */
  .ovbar{position:fixed;left:0;right:0;bottom:0;padding:2.2vw 2.4vw;display:flex;align-items:flex-end;gap:1.4vw}
  .ovbar .board{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5vw;
    background:linear-gradient(90deg,rgba(255,46,136,.22),rgba(9,7,14,.92) 22%,rgba(9,7,14,.92) 78%,rgba(34,211,238,.18));
    border:1px solid rgba(255,255,255,.14);border-radius:.9vw;padding:1.1vw 1.8vw;
    box-shadow:0 2vw 4vw -2vw rgba(0,0,0,.9)}
  .ovbar .pn{font-size:2.5vw;font-weight:900;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovbar .pc{font-size:.95vw;letter-spacing:.22em;text-transform:uppercase;color:#bdb4d0;margin-top:.3vw}
  .ovbar .b{text-align:right}
  .ovbar .mid{text-align:center;min-width:8vw}
  .ovbar .vs{font-size:1.3vw;font-weight:900;letter-spacing:.25em;color:var(--acc)}
  .ovbar .rd{font-size:.8vw;letter-spacing:.2em;text-transform:uppercase;color:#9a92ad;margin-top:.3vw;white-space:nowrap}
  .ovbar .next{width:20vw;background:rgba(9,7,14,.85);border:1px solid rgba(255,255,255,.1);border-radius:.9vw;padding:.9vw 1.1vw}
  .ovbar .next .hd{font-size:.72vw;letter-spacing:.24em;text-transform:uppercase;color:#8d85a0;margin-bottom:.5vw}
  .ovbar .next .r{display:flex;justify-content:space-between;gap:.6vw;font-size:.9vw;padding:.3vw 0;border-top:1px solid rgba(255,255,255,.07)}
  .ovbar .next .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){
    .bracket{gap:1.4rem}
    .round{min-width:210px}
    .bracket.gf .match{width:240px}
    .bheadrow{align-items:flex-start}
    .ov{grid-template-columns:1fr;height:auto}
    .ov .who{font-size:6vw}.ov .ch{font-size:2.6vw}.ov .vs{font-size:3vw}
    .ovbar{flex-direction:column;align-items:stretch;padding:4vw}
    .ovbar .pn{font-size:6vw}.ovbar .pc,.ovbar .rd{font-size:2.4vw}.ovbar .vs{font-size:3vw}
    .ovbar .next{width:auto}.ovbar .next .r{font-size:2.6vw}
  }
</style>
</head>
<body>
<header class="top">
  <div class="mark"></div>
  <div class="brand">Bracket</div>
  <div class="sp"></div>
  <div id="acct" class="row" style="gap:.4rem"></div>
  <button class="btn g sm" data-act="home">Torneos</button>
  <button class="btn g sm" data-act="settings">⚙︎</button>
</header>
<main class="wrap" id="app"></main>
<div id="modal"></div>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

/* ============================================================
   MOTOR DE BRACKETS
   ============================================================ */
function nextPow2(n) { let s = 2; while (s < n) s *= 2; return Math.max(2, s); }

  while (arr.length < n) {
    const len = arr.length * 2, out = [];
    for (const s of arr) { out.push(s); out.push(len + 1 - s); }

  }

}

function buildStructure(size, format) {
  const k = log2(size), M = {}, W = [], L = [];
  for (let r = 0; r < k; r++) {
    W[r] = [];
    const cnt = size / 2 ** (r + 1);
    for (let i = 0; i < cnt; i++) {
      const id = "W" + r + "-" + i;
      W[r].push(id);
      M[id] = { id, side: "W", round: r, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
    }
  }
  for (let r = 0; r < k; r++) for (let i = 0; i < W[r].length; i++) {
    const m = M[W[r][i]];
    if (r < k - 1) m.nextWin = [W[r + 1][Math.floor(i / 2)], i % 2 ? "b" : "a"];
    else m.nextWin = ["GF-0", "a"];
    if (format === "double") {
      if (r === 0) m.nextLose = ["L0-" + Math.floor(i / 2), i % 2 ? "b" : "a"];
      else if (r < k - 1) m.nextLose = ["L" + (2 * r - 1) + "-" + (W[r].length - 1 - i), "b"];
      else m.nextLose = ["L" + (2 * k - 3) + "-0", "b"];

      for (let i = 0; i < s; i++) {

        M[id] = { id, side: "L", round: j, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
      }
      if (j + 1 < total) {
        L[j + 1] = [];
        for (let i = 0; i < s; i++) {
          const id = "L" + (j + 1) + "-" + i;
          L[j + 1].push(id);
          M[id] = { id, side: "L", round: j + 1, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
        }
      }
      j += 2;
      if (j < total) s = Math.max(1, s / 2);
    }
    for (let r = 0; r < total; r++) for (let i = 0; i < L[r].length; i++) {
      const m = M[L[r][i]];
      if (r % 2 === 0) m.nextWin = r + 1 < total ? [L[r + 1][i], "a"] : ["GF-0", "b"];

function rosterOf(t) {
  if (t.qualified && t.qualified.length) {
    return t.qualified.map(id => t.players.find(p => p.id === id)).filter(Boolean);
  }
  return t.players.filter(p => p.in !== false).slice().sort((a, b) =>
    (a.seed == null ? 1e9 : a.seed) - (b.seed == null ? 1e9 : b.seed) || a.createdAt - b.createdAt);
}

/* ============================================================
   FASE DE GRUPOS (round robin simple, estilo pools de EVO)
   ============================================================ */
const POOL_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

/* parejas todos contra todos (método del círculo) */
function rrPairs(ids) {
  const list0 = ids.slice();
  if (list0.length % 2) list0.push(null);
  const n = list0.length, out = [];
  let list = list0.slice();
  for (let r = 0; r < n - 1; r++) {

      if (a && b) out.push([a, b]);

    list = [list[0]].concat([list[n - 1]], list.slice(1, n - 1));
  }

  const count = Math.max(2, +t.poolCount || 4);
  const roster = rosterOf(t);
  const groups = [];
  for (let i = 0; i < count; i++) {
    groups.push({ id: "g" + i, name: "Pool " + (POOL_LETTERS[i] || i + 1), players: [] });
  }
  /* reparto en serpiente: 1→A 2→B 3→C 4→C 5→B 6→A ... los mejores no se cruzan */
  roster.forEach((p, idx) => {
    const round = Math.floor(idx / count), pos = idx % count;
    const gi = round % 2 === 0 ? pos : count - 1 - pos;
    groups[gi].players.push(p.id);

  groups.forEach(g => {
    g.matches = rrPairs(g.players).map((pr, i) => ({ id: g.id + "-" + i, a: pr[0], b: pr[1] }));

  t.poolResults = {};
  t.qualified = null;

function standings(t, g) {
  const rows = g.players.map(pid => ({ pid, w: 0, l: 0, sw: 0, sl: 0, diff: 0 }));
  const map = {};
  rows.forEach(r => { map[r.pid] = r; });
  (g.matches || []).forEach(m => {
    const res = (t.poolResults || {})[m.id];
    if (!res) return;
    const A = map[m.a], B = map[m.b];
    if (!A || !B) return;
    A.sw += res[0]; A.sl += res[1];
    B.sw += res[1]; B.sl += res[0];
    if (res[0] > res[1]) { A.w++; B.l++; } else { B.w++; A.l++; }
  });
  rows.forEach(r => { r.diff = r.sw - r.sl; });
  rows.sort((x, y) => y.w - x.w || y.diff - x.diff || x.pid.localeCompare(y.pid));
  return rows;
}

function poolsStats(t) {
  if (!t.pools) return { total: 0, played: 0, done: false };
  let total = 0, played = 0;
  t.pools.groups.forEach(g => {
    total += (g.matches || []).length;
    (g.matches || []).forEach(m => { if ((t.poolResults || {})[m.id]) played++; });
  });
  return { total, played, done: played >= total };

  const adv = t.pools.advance;

    const st = standings(t, g);

      if (!st[r]) continue;
      if (r === 0) winners.push(st[r].pid); else others.push(st[r].pid);
    }
  });

  t.qualified = winners.concat(others);
  t.size = nextPow2(t.qualified.length);

  t.results = {};

function computeBracket(t) {
  const size = t.size || nextPow2(t.players.length || 2);

    const m = B.matches[B.W[0][i]];
    const s1 = ord[i * 2], s2 = ord[i * 2 + 1];
    m.a = s1 <= roster.length ? roster[s1 - 1].id : BYE;
    m.b = s2 <= roster.length ? roster[s2 - 1].id : BYE;
  }
  const results = t.results || {};
  let guard = 0, changed = true;
  while (changed && guard++ < 4000) {
    changed = false;
    for (const m of Object.values(B.matches)) {
      if (m.done) continue;
      if (m.a && m.b && (m.a === BYE || m.b === BYE)) {
        resolve(B, t, m, m.a === BYE ? 0 : 1, m.b === BYE ? 0 : 1);
        changed = true;
      } else if (m.a && m.b && m.a !== BYE && m.b !== BYE && results[m.id]) {
        const r = results[m.id];
        if (+r[0] !== +r[1]) { resolve(B, t, m, +r[0], +r[1]); changed = true; }
      } else if (m.a && m.b && m.a !== BYE && m.b !== BYE && (isRetired(t, m.a) || isRetired(t, m.b))) {
        /* retirado: la partida pendiente se da por perdida; el rival avanza */
        const ar = isRetired(t, m.a), br = isRetired(t, m.b);
        const sa = ar && !br ? 0 : 1;
        const sb = br && !ar ? 0 : (ar && br ? 0 : 1);
        m.auto = true;
        resolve(B, t, m, sa, sb);
        changed = true;
      }
    }
  }
  let champ = null;
  if (t.format === "single") {
    const fin = B.matches[B.W[B.W.length - 1][0]];
    champ = fin.done ? fin.winPid : null;
  } else {
    const g1 = B.matches["GF-1"];
    if (g1) champ = g1.done ? g1.winPid : null;          // hay reset: falta jugarla
    else if (B.matches["GF-0"].done) champ = B.matches["GF-0"].winPid;
  }
  if (champ === BYE) champ = null;
  B.champ = champ;
  const losses = {};
  for (const m of Object.values(B.matches)) {
    if (!m.done || !m.winPid) continue;
    const lp = m[m.winner === "a" ? "b" : "a"];
    if (lp && lp !== BYE) losses[lp] = (losses[lp] || 0) + 1;
  }
  return { B, champ, losses, roster };
}

function resolve(B, t, m, sa, sb) {
  m.sa = sa; m.sb = sb; m.done = true;
  const aWins = sa > sb;
  m.winner = aWins ? "a" : "b";
  const wp = m[aWins ? "a" : "b"];
  const lp = m[aWins ? "b" : "a"];
  m.winPid = wp;
  const put = (ref, pid) => {
    if (!ref || !pid) return;
    const nm = B.matches[ref[0]];
    if (nm && !nm.done) nm[ref[1]] = pid;
  };
  put(m.nextWin, wp);
  /* si el que pierde se retiró, su lugar en perdedores queda como BYE:
     el rival de esa partida avanza solo y la llave no se traba */
  if (m.nextLose && lp) put(m.nextLose, isRetired(t, lp) ? BYE : lp);
  if (m.id === "GF-0" && t.format === "double" && m.winner === "b") {
    if (!B.matches["GF-1"]) {
      B.matches["GF-1"] = { id: "GF-1", side: "GF", round: 1, idx: 0, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null, no: "GF2" };
      B.GF.push("GF-1");
    }
    const g = B.matches["GF-1"];
    if (!g.done) { g.a = lp; g.b = wp; }
  }
}

function playable(B) {
  return Object.values(B.matches).filter(m => !m.done && m.a && m.b && m.a !== BYE && m.b !== BYE);
}
function byId(t) {
  const map = {};
  for (const p of t.players) map[p.id] = p;
  return map;
}
function matchLabel(m) {
  if (m.side === "W") return m.round === 0 ? "Ganadores · R1" : (m.nextWin && m.nextWin[0] === "GF-0" ? "Final de ganadores" : "Ganadores · R" + (m.round + 1));
  if (m.side === "L") return "Perdedores · R" + (m.round + 1);
  return m.id === "GF-0" ? "Gran final" : "Gran final · Reset";
}

/* ============================================================
   MODO FIESTA (varios jugadores por partida, por puestos)
   Ej: Mario Kart 4 jugadores → pasan 2 a ganadores, 1 a perdedores.
   ============================================================ */
function heatChunks(ids, K) {
  const n = ids.length;
  if (!n) return [];
  K = Math.max(2, K);
  if (n <= K) return [ids.slice()];
  /* primero se llenan las partidas completas de K; el resto queda en la última.
     Los mejores se reparten en serpiente entre las partidas completas. */
  const full = Math.floor(n / K), rem = n % K;
  const groups = Array.from({ length: full + (rem ? 1 : 0) }, () => []);
  const main = ids.slice(0, full * K);
  for (let i = 0; i < main.length; i++) {
    const r = Math.floor(i / full), pos = i % full;
    const gi = r % 2 === 0 ? pos : full - 1 - pos;
    groups[gi].push(main[i]);
  }
  if (rem) groups[full] = ids.slice(full * K);
  return groups.filter(g => g.length);
}

function heatOrderOf(t, id, players) {
  const o = (t.orders || {})[id];
  if (!o || o.length !== players.length) return null;
  if (!players.every(p => o.indexOf(p) >= 0)) return null;
  return o.slice();
}

function computeHeat(t) {
  const K = clamp(+t.perMatch || 4, 2, 8);
  const aW = clamp(+t.advW || 2, 1, K - 1);
  const dbl = t.format === "double";
  const aL = dbl ? clamp(t.advL == null ? 1 : +t.advL, 0, K - 1) : 0;
  const all = {}, W = [], L = [];
  let champW = null, champL = null, gf = null;
  const dropped = [];
  let no = 0;
  const roster = rosterOf(t).map(p => p.id);
  let field = roster.slice();
  if (field.length === 1) champW = field[0];

  /* perdedores: se construyen en paralelo a ganadores.
     losersQueue = jugadores para la próxima ronda de perdedores.
     pendingDrops = caídos que esperan que termine la ronda actual. */
  let losersQueue = [];
  let pendingDrops = [];
  let losersRound = null;
  let winnersDone = false;
  const out = (pid) => isRetired(t, pid);

  const buildRound = (ids, side, roundIndex, final) => {
    const groups = heatChunks(ids, K);
    const round = [], next = [];
    let doneAll = true;
    groups.forEach((pl, i) => {
      const active = pl.filter(p => !out(p));
      const id = idFor(side, roundIndex, i);
      /* si la partida ya se jugó con el grupo original (antes de un retiro), se respeta */
      const ordAll = heatOrderOf(t, id, pl);
      let ord = ordAll || heatOrderOf(t, id, active);
      let use = ordAll ? pl : active;
      let extra = [];
      /* perdedores: si la partida ya se jugó con menos jugadores y después
         cayó uno más, se conserva el resultado y el nuevo espera la próxima ronda */
      if (!ord && side === "L") {
        const saved = (t.orders || {})[id];
        if (saved && saved.length > 1 && saved.length < pl.length && saved.every(p => pl.indexOf(p) >= 0)) {
          ord = saved.slice();
          use = saved.slice();
          extra = pl.filter(p => saved.indexOf(p) < 0);
        }
      }
      if (!use.length) return; // grupo vacío: no existe la partida
      const m = {
        id, side, round: roundIndex, idx: i, final,
        players: use.slice(),
        order: ord,
        done: !!ord || use.length === 1,
        advance: [],
        drops: [],
        auto: use.length === 1,
        retiredOut: pl.filter(p => out(p)),
        no: ++no,
      };
      if (use.length === 1) m.order = use.slice();
      if (m.done) {
        if (side === "W") {
          const advN = Math.min(aW, Math.max(1, use.length - 1));
          if (final) {
            m.advance = m.order.slice(0, 1);
            champW = m.order[0];
            if (dbl) {
              m.drops = m.order.slice(1, 1 + aL);
              m.drops.forEach(p => { dropped.push(p); pendingDrops.push(p); });
            }
          } else {
            m.advance = m.order.slice(0, advN);
            m.advance.forEach(p => next.push(p));
            if (dbl) {
              m.drops = m.order.slice(advN, advN + aL);
              m.drops.forEach(p => { dropped.push(p); pendingDrops.push(p); });
            }
          }
        } else {
          m.advance = m.order.slice(0, 1);
          next.push(m.order[0]);
        }
      } else {
        doneAll = false;
      }
      all[id] = m; round.push(m);
      if (extra.length) extra.forEach(p => pendingDrops.push(p));
    });
    return { round, next, doneAll };
  };

  const buildLosers = () => {
    if (!dbl) return;
    if (losersRound && !losersRound.done) return;
    if (losersRound && losersRound.done) {
      losersQueue = losersRound.next.slice();
      losersRound = null;
    }
    if (pendingDrops.length) {
      losersQueue = losersQueue.concat(pendingDrops);
      pendingDrops = [];
    }
    let guard = 0;
    while (losersQueue.length > 1 && guard++ < 40) {
      const res = buildRound(losersQueue, "L", L.length, false);
      L.push({ title: "Perdedores " + (L.length + 1), matches: res.round });
      if (!res.doneAll) {
        losersRound = { matches: res.round, next: res.next, done: false };
        return;
      }
      losersQueue = res.next;
    }
    if (winnersDone && losersQueue.length === 1) champL = losersQueue[0];
  };

  let guard = 0;
  while (field.length > 1 && guard++ < 40) {
    const groups = heatChunks(field, K);
    const final = groups.length === 1;
    const res = buildRound(field, "W", W.length, final);
    W.push({ title: final ? "Final de ganadores" : "Ganadores " + (W.length + 1), matches: res.round });
    /* los perdedores se arman ya con los caídos de las partidas jugadas,
       sin esperar a que termine toda la ronda de ganadores */
    buildLosers();
    if (!res.doneAll) break;
    if (final) { winnersDone = true; break; }
    field = res.next;
  }
  if (champW) winnersDone = true;
  if (winnersDone) buildLosers();

  if (champW && champL) {
    const wOut = out(champW), lOut = out(champL);
    let ord = heatOrderOf(t, "GF", [champW, champL]);
    let auto = false;
    if (wOut || lOut) {
      const winner = wOut && !lOut ? champL : champW;
      const loser = winner === champW ? champL : champW;
      ord = [winner, loser];
      auto = true;
    }
    gf = {
      id: "GF", side: "GF", round: 0, final: true,
      players: [champW, champL], order: ord,
      done: !!ord || auto, advance: ord ? ord.slice(0, 1) : [],
      auto, no: ++no,
    };
    all.GF = gf;
  }

  const champ = (dbl && (dropped.length || L.length)) ? (gf && gf.done ? gf.order[0] : null) : champW;
  /* jugadores que bajaron y todavía esperan que se arme su próxima ronda de perdedores */
  const waiting = pendingDrops.concat(losersQueue);
  return { kind: "heat", W, L, GF: gf, all, champ, champW, champL, dropped, waiting, roster: rosterOf(t), K, aW, aL };
}

function idFor(side, round, i) { return side + round + "-" + i; }

function heatPending(H) {
  return Object.values(H.all).filter(m => !m.done && m.players.length > 1);
}

function heatLabel(m) {
  if (m.side === "GF") return "Gran final";
  if (m.side === "L") return "Perdedores · R" + (m.round + 1);
  return (m.final ? "Final de ganadores" : "Ganadores · R" + (m.round + 1));
}

function heatRules(t, H, m) {
  const aL = t.format === "double" ? clamp(t.advL == null ? 1 : +t.advL, 0, H.K - 1) : 0;
  if (m.side === "GF") return "El ganador de esta final se lleva el torneo.";
  if (m.side === "L") return "Pasa 1 a la siguiente ronda de perdedores; el resto queda eliminado.";
  if (m.final) return `El 1.º es campeón${aL ? ` y el ${aL + 1}.º baja a perdedores` : ""}.`;
  const advN = Math.min(H.aW, Math.max(1, m.players.length - 1));
  return `Pasan ${advN} a ganadores${aL ? `, ${aL} bajan a perdedores` : ""}; el resto queda eliminado.`;
}

function heatCard(t, m, clickable) {
  const done = m.done && m.order;
  const list = done ? m.order : m.players;
  const rows = list.map((pid, i) => {
    const place = done ? i + 1 : 0;
    const passes = done && m.advance.indexOf(pid) >= 0;
    const champ = done && m.final && i === 0;
    const drops = done && m.side === "W" && (m.drops || []).indexOf(pid) >= 0;
    const cls = champ ? "first" : passes ? "pass" : drops ? "drop" : done ? "out" : "";
    const label = champ ? "🏆" : passes ? "pasa" : drops ? "baja" : done ? "eliminado" : "";
    return `<div class="p ${cls}">
      <span class="s">${done ? place : ""}</span>
      <span class="n"${clickable ? ` data-act="player" data-id="${pid}" style="cursor:pointer"` : ""}>${esc(pidName(t, pid))}${isRetired(t, pid) ? ` <span class="badge warn">ret.</span>` : ""}</span>
      <span class="c">${label}</span></div>`;
  }).join("");
  const retNote = (m.retiredOut || []).length ? ` · ${m.retiredOut.length} retirado${m.retiredOut.length > 1 ? "s" : ""}` : "";
  return `<div class="match heat ${done ? "done" : ""} ${t.stream === m.id ? "live" : ""}" data-act="heat" data-id="${m.id}">
    <div class="mhead"><span class="mno">#${m.no || ""}</span><span class="mrd">${heatLabel(m)}</span>${t.stream === m.id ? `<span class="badge live">EN VIVO</span>` : ""}</div>
    ${rows}
    <div class="mfoot"><span class="tiny muted">${m.players.length} jugadores${m.auto ? " · pase directo" : ""}${retNote}</span>${done ? "" : `<span class="badge">pendiente</span>`}</div>
  </div>`;
}

function heatConns(n, nextN, last) {
  if (last || !nextN || n !== nextN * 2) return "";
  const out = [];
  for (let j = 0; j < nextN; j++) {
    const top = ((2 * j + 0.5) / n) * 100;
    const h = (1 / n) * 100;
    out.push(`<span class="conn" style="top:${top}%;height:${h}%"></span>`);
  }
  return out.join("");
}

function bracketViewHeat(t, H, adm) {
  const view = S.ui.bview || "all";
  const showW = view !== "L";
  const showL = view !== "W" && t.format === "double";
  const sched = heatPending(H).length;
  const gf = H.GF ? [H.GF] : [];
  return `
  <div class="bheadrow">
    <div class="tabs" role="tablist">
      <button class="tab" data-act="bview" data-view="all" aria-selected="${view === "all"}">Cuadro completo</button>
      <button class="tab" data-act="bview" data-view="W" aria-selected="${view === "W"}">Ganadores</button>
      ${t.format === "double" ? `<button class="tab" data-act="bview" data-view="L" aria-selected="${view === "L"}">Perdedores</button>` : ""}
    </div>
    <div class="row tiny muted" style="gap:.4rem;flex-wrap:wrap">
      <span class="badge">${H.K} por partida</span>
      <span class="badge">pasan ${H.aW}</span>
      ${t.format === "double" ? `<span class="badge">${H.aL} a perdedores</span>` : `<span class="badge">sin perdedores</span>`}
      <span class="badge ${sched ? "" : "ok"}">${sched ? sched + " pendientes" : "al día"}</span>
      ${H.champ ? `<span class="badge ok">Campeón: ${esc(pidName(t, H.champ))}</span>` : ""}
      ${adm ? `<button class="btn sm g danger" data-act="resetbracket" title="Borra todos los resultados">Reiniciar llaves</button>` : ""}
    </div>
  </div>
  ${showW ? `<section class="bsection">
    <div class="bhead"><span class="bdot w"></span>Ganadores</div>
    <div class="bracket winners">
      ${H.W.map((r, i) => `<div class="round ${i === H.W.length - 1 ? "last" : ""} ${i === 0 ? "first" : ""}">
        <h4>${r.title}</h4><div class="ms">${r.matches.map(m => heatCard(t, m, true)).join("")}${heatConns(r.matches.length, H.W[i + 1] ? H.W[i + 1].matches.length : 0, i === H.W.length - 1)}</div>
      </div>`).join("")}
    </div>
  </section>` : ""}
  ${showL ? `<section class="bsection">
    <div class="bhead"><span class="bdot l"></span>Perdedores</div>
    ${H.L.length ? `<div class="bracket losers">
      ${H.L.map((r, i) => `<div class="round ${i === H.L.length - 1 ? "last" : ""} ${i === 0 ? "first" : ""}">
        <h4>${r.title}</h4><div class="ms">${r.matches.map(m => heatCard(t, m, true)).join("")}${heatConns(r.matches.length, H.L[i + 1] ? H.L[i + 1].matches.length : 0, i === H.L.length - 1)}</div>
      </div>`).join("")}
    </div>` : `<div class="card tiny muted">Se arma a medida que caen jugadores de la llave de ganadores.</div>`}
    ${H.champL && !H.GF ? `<div class="tiny muted" style="margin-top:.5rem">${esc(pidName(t, H.champL))} espera en la final de perdedores.</div>` : ""}
  </section>` : ""}
  ${gf.length ? `<section class="bsection">
    <div class="bhead"><span class="bdot g"></span>Gran final</div>
    <div class="bracket gf">${gf.map(m => heatCard(t, m, true)).join("")}</div>
  </section>` : ""}
  `;
}

function tabHeat(t, adm, H, clickable) {
  return bracketViewHeat(t, H, adm);
}

/* modal: tocar en orden de llegada */
let heatPick = [];
let heatOpen = null;
function openHeat(t, id) {
  const H = computeHeat(t);
  const m = H.all[id];
  if (!m) return;
  heatOpen = id;
  heatPick = m.order ? m.order.slice() : [];
  $("#modal").innerHTML = `
  <div class="modal"><div class="box" data-stop>
    <div class="row" style="justify-content:space-between">
      <span class="label">${heatLabel(m)}</span>
      <span class="tiny muted">${m.players.length} jugadores</span>
    </div>
    <div class="tiny muted" style="margin-top:.4rem">Tocá a cada jugador en el orden en que terminó la partida (1º, 2º, 3º…). Volvé a tocarlo para sacarlo.</div>
    <div id="heatList" class="grid" style="gap:.4rem;margin-top:.7rem"></div>
    <div class="row" style="margin-top:.9rem;flex-wrap:wrap">
      <button class="btn p" data-act="heatsave" data-id="${m.id}">Guardar resultado</button>
      <button class="btn sm g" data-act="heatclear">Reiniciar orden</button>
      ${m.order ? `<button class="btn sm g danger" data-act="heatdel" data-id="${m.id}">Borrar resultado</button>` : ""}
    </div>
    <div class="tiny muted" style="margin-top:.5rem">${esc(heatRules(t, H, m))}</div>
  </div></div>`;
  paintHeat(t, m);
  wireModal();
}

function paintHeat(t, m) {
  const box = $("#heatList");
  if (!box) return;
  box.innerHTML = m.players.map(pid => {
    const pos = heatPick.indexOf(pid);
    return `<button class="pick ${pos >= 0 ? "on" : ""}" data-act="heatpick" data-id="${pid}">
      <span class="pickn">${pos >= 0 ? pos + 1 : "·"}</span>
      <span class="pickname">${esc(pidName(t, pid))}</span>
      <span class="tiny muted">${esc(pidChar(t, pid) || "")}</span>
    </button>`;
  }).join("");
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const r = route();
  document.body.classList.toggle("overlay", r.name === "overlay");
  if (r.name === "overlay") { paintAccount(); renderOverlay(r.t); return; }
  if (r.name === "home") renderHome();
  else if (r.name === "settings") renderSettings();
  else if (r.name === "missing") {
    $("#app").innerHTML = `<div class="card">Torneo no encontrado. <a href="#/">Volver</a>
      <div class="tiny muted" style="margin-top:.4rem">Si te pasaron este link recién, esperá un segundo: se está conectando con la nube…</div></div>`;
    pullRemote(false);
  }
  else if (r.name === "test") renderTest();
  else if (r.name === "reg") renderReg(r.t);
  else if (r.name === "watch") renderWatch(r.t);
  else if (r.name === "gate") renderGate(r.t);
  else if (r.name === "jlink") renderJudgeLink(r.t, r.token);
  else if (r.name === "plink") renderPlayerLink(r.t, r.token);
  else if (r.name === "trn") renderTournament(r.t);
  paintAccount();
}

/* barra de cuenta: muestra el rango y permite entrar desde cualquier dispositivo */
function paintAccount() {
  const box = $("#acct");
  if (!box) return;
  const r = route();
  if (!r.t || r.name === "overlay" || r.name === "test" || r.name === "settings" || r.name === "gate" || r.name === "jlink" || r.name === "plink" || r.name === "reg") {
    box.innerHTML = "";
    return;
  }
  const t = r.t;
  const role = roleOf(t);
  const p = role === "player" ? playerOf(t, S.me[t.id]) : null;
  const j = role === "judge" ? judgeOf(t) : null;
  const label = role === "admin" ? "Admin" : role === "judge" ? "Juez" : role === "player" ? "Jugador" : "Entrar";
  const who = role === "judge" ? (j ? j.name : "") : role === "player" ? (p ? p.name : "") : "";
  const cls = role === "admin" ? "ok" : role === "judge" ? "warn" : role === "player" ? "" : "live";
  box.innerHTML = `<button class="btn sm g" data-act="account" data-id="${t.id}" title="Tu cuenta en este torneo">
    <span class="badge ${cls}">${label}${who ? " · " + esc(who) : ""}</span>
  </button>`;
}

function openAccount(t) {
  const role = roleOf(t);
  const p = role === "player" ? playerOf(t, S.me[t.id]) : null;
  const j = role === "judge" ? judgeOf(t) : null;

  const body = role === "admin" ? `

        <button class="btn sm g" data-act="chpass">Cambiar contraseña</button>
        <button class="btn sm g" data-act="logout">Cerrar sesión de organizador</button>
      </div>`
    : role === "judge" ? `
      <div class="card tiny muted" style="padding:.6rem">Estás como <b style="color:var(--txt)">juez${j ? " · " + esc(j.name) : ""}</b>. Podés cargar resultados, editar jugadores y llamar turnos.</div>
      <div class="row" style="margin-top:.6rem">
        <button class="btn sm g" data-act="leave">Salir del modo juez</button>
      </div>`
    : role === "player" ? `
      <div class="card tiny muted" style="padding:.6rem">Estás como <b style="color:var(--txt)">jugador${p ? " · " + esc(p.name) : ""}</b>. Este es tu acceso personal: guardá el link o el código para volver desde otro celular.</div>
      ${p ? `<div class="row" style="margin-top:.6rem">

        <button class="btn sm g" data-act="logout">Salir de mi cuenta</button>

/* ---------------- tournament ---------------- */
function phaseOf(t, champ) {
  if (t.phase === "reg") return "reg";
  if (t.phase === "pools") return "pools";
  return champ ? "done" : "running";
}

/* acceso de jueces: link/QR propio o PIN */
function jtok(t, j) { return j.token || (t.id + j.id); }
function judgeLink(t, j) { return base() + "#/t/" + t.id + "/j/" + jtok(t, j); }
function judgeOf(t) {
  const id = (S.ui.judge && S.ui.judgeT === t.id) ? S.ui.judge : (S.judge || {})[t.id];
  return id ? (t.judges || []).find(j => j.id === id) || null : null;
}

/* acceso de jugadores: link/QR propio o código corto */
function ptok(t, p) { return p.token || (t.id + p.id); }
function playerLink(t, p) { return base() + "#/t/" + t.id + "/p/" + ptok(t, p); }
function pcode(t, p) { return p.code || (t.id.slice(-2) + p.id.slice(-3)).toUpperCase(); }
function playerOf(t, pid) { return (t.players || []).find(p => p.id === pid) || null; }
function isRetired(t, pid) { const p = playerOf(t, pid); return !!(p && p.retired); }
function playerByCode(t, code) {
  const c = String(code || "").trim().toUpperCase();
  return (t.players || []).find(p => pcode(t, p) === c) || null;
}
function roleName(t) {
  const r = roleOf(t);
  if (r === "admin") return "Organizador";
  if (r === "judge") { const j = judgeOf(t); return "Juez" + (j ? " · " + j.name : ""); }
  if (r === "player") { const p = playerOf(t, S.me[t.id]); return "Jugador" + (p ? " · " + p.name : ""); }
  return "Visitante";
}
function callPlayer(t, pid, matchId) {
  if (!t || !pid) return;
  t.calls = t.calls || {};
  t.calls[pid] = { at: now(), by: roleName(t), match: matchId || null };
  touch(t);
  toast("Aviso enviado a " + pidName(t, pid));
}
function rememberPerson(name) {
  const n = String(name || "").trim();
  if (!n) return;
  S.people = S.people || [];
  if (!S.people.some(x => x.toLowerCase() === n.toLowerCase())) {
    S.people.unshift(n);
    S.people = S.people.slice(0, 80);
  }
}
function tryLogin(t, v) {
  v = String(v || "").trim();
  if (!v) return null;
  if (t.adminPass) {
    if (v === t.adminPass) return { role: "admin" };
  } else if (v === t.adminPin) {
    return { role: "admin" };
  }
  const j = (t.judges || []).find(x => x.pin === v);
  return j ? { role: "judge", j } : null;
}
function gateSubmit(t) {
  const el = $("#pin");
  if (!el) return;
  const r = tryLogin(t, el.value);
  if (!r) return toast("Contraseña o PIN incorrecto");
  S.ui.pin = "";
  if (r.role === "admin") {
    S.owners[t.id] = true;
    saveDB();
    go("#/t/" + t.id);
    toast("Modo organizador");
    return;
  }
  S.judge = S.judge || {};
  S.judge[t.id] = r.j.id;
  S.ui.judge = r.j.id; S.ui.judgeT = t.id;
  saveDB();
  go("#/t/" + t.id);
  toast("Hola, " + r.j.name);
}

function roleOf(t) {
  if (isAdmin(t)) return "admin";
  if (judgeOf(t)) return "judge";
  if (S.me && S.me[t.id] && (t.players || []).some(p => p.id === S.me[t.id])) return "player";
  return "guest";
}

    </div>

    ${[["resumen", "Resumen"]]

  if (tab === "ruleta") body = tabRoulette(t);
  if (tab === "jueces") body = tabJudges(t);

  $("#app").innerHTML = head + body;
  if (tab === "resumen") drawQR(t);
}

function unseenCall(t, pid) {
  const c = (t.calls || {})[pid];
  if (!c) return null;
  const seen = (((S.callsSeen || {})[t.id]) || {})[pid] || 0;
  return c.at > seen ? c : null;
}
let notifiedCalls = {};
function notifyCall(t, pid, c) {
  const key = t.id + ":" + pid + ":" + c.at;
  if (notifiedCalls[key]) return;
  notifiedCalls[key] = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const ctx = new AC();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = .08;
      o.start(); o.stop(ctx.currentTime + .18);
      setTimeout(() => ctx.close(), 600);
    }
  } catch (e) { /* sin audio */ }
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("¡Es tu turno!", { body: pidName(t, pid) + " · " + t.name, tag: key });
    }
  } catch (e) { /* sin avisos */ }
}
function callAlert(t, pid, c) {
  const m = c.match ? (t.mode === "heat" ? computeHeat(t).all[c.match] : computeBracket(t).B.matches[c.match]) : null;
  const label = m ? (t.mode === "heat" ? heatLabel(m) : matchLabel(m)) : "";
  return `<div class="card grid" style="gap:.4rem;margin-top:.9rem;border-color:var(--warn);background:linear-gradient(120deg,rgba(251,191,36,.18),rgba(18,16,25,.9))">

    <div style="font-weight:800;font-size:1.1rem">${esc(pidName(t, pid))}, el organizador te está llamando.</div>
    <div class="tiny muted">${label ? esc(label) : "Acercate a la mesa."}${c.by ? " · " + esc(c.by) : ""}</div>
    <div class="row">
      <button class="btn p" data-act="dismisscall" data-id="${pid}" data-at="${c.at}">Voy</button>
      ${("Notification" in window && Notification.permission !== "granted") ? `<button class="btn sm g" data-act="notif">Activar avisos del celular</button>` : ""}
    </div>
  </div>`;
}

function aliveOf(t, pid, B, H) {
  if (isRetired(t, pid)) return false;
  if (H) {
    if (H.champ === pid || H.champL === pid) return true;
    if (heatPending(H).some(m => m.players.indexOf(pid) >= 0)) return true;
    if ((H.waiting || []).indexOf(pid) >= 0) return true;
    return false;
  }
  if (!B) return false;
  if (B.champ === pid) return true;
  if (playable(B).some(m => m.a === pid || m.b === pid)) return true;
  const gf = B.matches["GF-0"];
  if (gf && !gf.done && !gf.a) {
    const lastL = B.L[B.L.length - 1] || [];
    if (lastL.some(id => { const m = B.matches[id]; return m.done && m.winPid === pid; })) return true;
  }
  return false;
}

/* puesto estimado: 1 campeón, 2 finalista, 3.º/4.º semifinales, etc. */
function placeOf(t, pid, B, H) {
  if (!pid || !t) return null;
  if (H) {
    if (H.champ === pid) return 1;
    if (aliveOf(t, pid, null, H)) return null;
    const rankOf = (id) => {
      let r = null;
      Object.values(H.all).forEach(m => {
        if (m.players.indexOf(id) < 0) return;
        const v = m.side === "GF" ? 100000 : m.side === "L" ? 5000 + m.round : 1000 + m.round;
        if (r == null || v > r) r = v;
      });
      return r == null ? -1 : r;
    };
    const mine = rankOf(pid);
    if (mine < 0) return null;
    return 1 + rosterOf(t).filter(p => p.id !== pid && rankOf(p.id) > mine).length;
  }
  if (!B) return null;
  if (B.champ === pid) return 1;
  if (aliveOf(t, pid, B, null)) return null;
  const rankOf = (id) => {
    let r = null;
    Object.values(B.matches).forEach(m => {
      if (!m.done || !m.winPid) return;
      const lp = m[m.winner === "a" ? "b" : "a"];
      if (lp !== id) return;
      const v = m.side === "GF" ? 100000 : m.side === "L" ? 5000 + m.round : 1000 + m.round;
      if (r == null || v > r) r = v;
    });
    return r == null ? -1 : r;
  };
  const mine = rankOf(pid);
  if (mine < 0) return null;
  return 1 + rosterOf(t).filter(p => p.id !== pid && rankOf(p.id) > mine).length;
}

function myStatus(t, pid, B, H) {
  const heat = !!H;
  const p = playerOf(t, pid);
  const out = { pid, pending: [], played: [], champ: heat ? H.champ : null, eliminated: false, heat, retired: !!(p && p.retired), place: null };
  if (heat) {
    Object.values(H.all).forEach(m => {
      if (m.players.indexOf(pid) < 0) return;
      if (m.done) out.played.push(m); else out.pending.push(m);
    });
  } else {
    out.champ = B.champ;
    Object.values(B.matches).forEach(m => {
      if (m.a !== pid && m.b !== pid) return;
      if (m.done) out.played.push(m); else if (m.a !== BYE && m.b !== BYE) out.pending.push(m);
    });
  }
  out.waitingL = heat && !out.pending.length && (H.waiting || []).indexOf(pid) >= 0 && H.champ !== pid;
  out.place = placeOf(t, pid, B, H);
  out.eliminated = out.retired || (!out.pending.length && out.champ !== pid && !out.waitingL && !(out.played.length === 0 && t.phase === "reg"));
  return out;
}

function myCard(t, my) {
  const pid = my.pid;
  const next = my.pending[0];
  const inL = my.waitingL || !!(next && next.side === "L");
  const state = my.retired ? "Retirado" : my.champ === pid ? "Campeón 🏆" : my.eliminated ? "Eliminado" : inL ? "En perdedores" : next ? "Seguís en carrera" : "Esperando";
  const badge = my.retired ? "warn" : my.champ === pid ? "ok" : my.eliminated ? "warn" : inL ? "warn" : next ? "live" : "";
  let line = "";
  const opp = next && !my.heat ? (next.a === pid ? next.b : next.a) : null;
  if (my.retired) line = "Te marcaron como retirado. Podés seguir mirando el bracket.";
  else if (my.champ === pid) line = "¡Ganaste el torneo!";
  else if (my.eliminated) line = "Quedaste eliminado. Podés seguir mirando el bracket.";
  else if (my.waitingL) line = "Bajaste a la llave de perdedores. Esperás rival para la próxima ronda.";
  else if (next) line = my.heat
    ? `${heatLabel(next)} · contra ${next.players.filter(p => p !== pid).map(p => esc(pidName(t, p))).join(", ")}`
    : `${matchLabel(next)} · ${opp ? "vs " + esc(pidName(t, opp)) : "esperando rival"}`;
  else line = "Todavía no tenés partidas asignadas.";
  return `<div class="card grid" style="gap:.4rem;margin-top:.9rem;border-color:#3d3450">
    <div class="row" style="justify-content:space-between">
      <div class="label">Tu situación</div>
      <div class="row" style="gap:.35rem">
        ${my.place ? `<span class="badge">Puesto ${my.place}</span>` : ""}
        <span class="badge ${badge}">${state}</span>
      </div>
    </div>
    <div style="font-weight:800;font-size:1.15rem">${esc(pidName(t, pid))}</div>
    <div class="tiny muted">${line}</div>
    <div class="row">
      <button class="btn sm g" data-act="player" data-id="${pid}">Mi trayectoria</button>
      <button class="btn sm g" data-act="account" data-id="${t.id}">Mi cuenta</button>
      ${next ? `<span class="tiny muted">El juez carga el resultado.</span>` : ""}
    </div>
  </div>`;
}

function openPlayer(t, pid) {
  const p = (t.players || []).find(x => x.id === pid);
  if (!p) return;
  const heat = t.mode === "heat";
  const H = heat ? computeHeat(t) : null;
  const { B, champ } = heat ? { B: null, champ: H.champ } : computeBracket(t);
  const rows = [];
  if (heat) {
    Object.values(H.all).filter(m => m.players.indexOf(pid) >= 0).forEach(m => {
      const i = m.order ? m.order.indexOf(pid) : -1;
      rows.push({
        done: m.done,
        label: heatLabel(m),
        txt: m.done ? `${i + 1}º de ${m.players.length}` : `con ${m.players.filter(x => x !== pid).map(x => pidName(t, x)).join(", ")}`,
        win: m.done && m.advance.indexOf(pid) >= 0,
      });
    });
  } else {
    Object.values(B.matches).filter(m => (m.a === pid || m.b === pid) && m.a !== BYE && m.b !== BYE).forEach(m => {
      const win = m.done && ((m.a === pid && m.winner === "a") || (m.b === pid && m.winner === "b"));
      const mine = m.a === pid ? m.sa : m.sb;
      const theirs = m.a === pid ? m.sb : m.sa;
      rows.push({
        done: m.done,
        label: matchLabel(m),
        txt: m.done ? `${mine} – ${theirs} vs ${pidName(t, m.a === pid ? m.b : m.a)}` : `vs ${pidName(t, m.a === pid ? m.b : m.a)}`,
        win,
      });
    });
  }
  const canManage = roleOf(t) === "admin" || roleOf(t) === "judge";
  const alive = aliveOf(t, pid, B, H);
  const place = placeOf(t, pid, B, H);
  const rf = regFields(t);
  const meta = [
    (rf.char || canManage) ? p.char : "",
    (rf.level || canManage) ? p.level : "",
    p.seed ? "seed " + p.seed : "",
  ].filter(Boolean);
  $("#modal").innerHTML = `
  <div class="modal"><div class="box" data-stop>
    <div class="row" style="justify-content:space-between">
      <span class="label">Trayectoria</span>
      <div class="row" style="gap:.35rem">
        ${place ? `<span class="badge">Puesto ${place}</span>` : ""}
        <span class="badge ${p.retired ? "warn" : champ === pid ? "ok" : alive ? "" : "warn"}">${p.retired ? "Retirado" : champ === pid ? "Campeón" : alive ? "En carrera" : "Eliminado"}</span>
      </div>
    </div>
    <div style="font-weight:900;font-size:1.3rem;margin:.3rem 0">${esc(p.name)}</div>
    <div class="tiny muted" style="margin-bottom:.6rem">${meta.map(esc).join(" · ") || "—"}</div>
    <div class="grid" style="gap:.35rem">
      ${rows.map(r => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:.35rem;gap:.6rem">
        <span class="tiny ${r.win ? "" : "muted"}" style="${r.win ? "color:var(--ok)" : ""}">${r.done ? (r.win ? "✔ " : "✘ ") : "· "}${esc(r.label)}</span>
        <span class="tiny muted" style="text-align:right">${esc(r.txt)}</span>
      </div>`).join("") || `<div class="tiny muted">Sin partidas todavía.</div>`}
    </div>
    <div class="row" style="margin-top:.9rem;flex-wrap:wrap">
      <button class="btn g" data-act="close">Cerrar</button>
      <button class="btn sm g" data-act="myqr" data-id="${p.id}">Mi link y QR</button>
      ${canManage ? `<button class="btn sm g" data-act="call" data-id="${p.id}">🔔 Avisar turno</button>` : ""}
      ${canManage ? `<button class="btn sm g ${p.retired ? "" : "danger"}" data-act="retire" data-id="${p.id}">${p.retired ? "Reactivar" : "Retirar"}</button>` : ""}
    </div>
  </div></div>`;
  wireModal();
}

function tabResumen(t, B, champ, n, adm, ph, H) {

      <div style="display:flex;flex-direction:column;align-items:center;gap:.35rem">

        <div class="tiny muted" style="max-width:150px;text-align:center;word-break:break-all;font-size:.65rem">${location.protocol === "file:" ? "Publicá la app en una URL (GitHub Pages) para que el QR funcione" : esc(url.replace(/^https?:\/\//, ""))}</div>
      </div>
      <div class="grid" style="gap:.4rem">

          <button class="btn sm g" data-act="copy" data-link="${linkOf(t.id, "overlay")}">Overlay OBS</button>
        </div>

    </div>
    ${ph === "reg" ? `<div class="card grid" style="gap:.6rem">
      <div class="label">Paso siguiente</div>
      <div class="tiny muted">Cuando terminen de anotarse: cerrá el registro, hacé el check-in de los presentes y ${t.poolCount ? "sorteá los grupos" : "generá las llaves"}.</div>
      <div class="row">${adm ? `<button class="btn p" data-act="start" ${n < 2 ? "disabled" : ""}>${t.poolCount ? `Sortear grupos (${n})` : `Iniciar torneo (${n})`}</button>` : `<span class="tiny muted">Esperando al organizador.</span>`}</div>
    </div>` : ph === "pools" ? (() => {
      const ps = poolsStats(t);
      const pct = ps.total ? Math.round(ps.played / ps.total * 100) : 0;
      return `<div class="card grid" style="gap:.6rem">
        <div class="row" style="justify-content:space-between"><div class="label">Fase de grupos</div>
          <span class="tiny muted">${ps.played}/${ps.total} partidas · pasan ${t.pools.advance} por pool</span></div>
        <div style="height:6px;background:#1b1726;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s"></div></div>

          ${adm ? `<button class="btn g" data-act="closepools">Cerrar grupos y armar bracket</button>` : ""}
        </div>
      </div>`;
    })() : `
    <div class="card grid" style="gap:.5rem">
      <div class="row" style="justify-content:space-between"><div class="label">Próximas partidas</div>
        <span class="tiny muted">${pend.length} pendientes</span></div>
      ${next.length ? next.map(m => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:.45rem">

        <button class="btn sm g" data-act="callmatch" data-id="${m.id}" title="Avisar a los jugadores que es su turno">🔔</button>
        <button class="btn sm g" data-act="${m.kind}" data-id="${m.id}">Reportar</button></div>
      </div>`).join("") : `<div class="tiny muted">Sin partidas pendientes.</div>`}
    </div>`}
  </div>`;
}

function tabBracketPending(t) {
  const st = poolsStats(t);
  return `<div class="card grid" style="gap:.6rem;max-width:620px">
    <div class="label">Bracket</div>
    <div class="tiny muted">La llave se arma cuando cierres la fase de grupos. Clasifican ${t.pools ? t.pools.advance : 2} por pool (${st.played}/${st.total} partidas jugadas).</div>

              ${canManage && !p.retired ? `<button class="btn sm g" data-act="call" data-id="${p.id}" title="Avisarle que es su turno">🔔</button>` : ""}
              ${canManage ? `<button class="btn sm g ${p.retired ? "" : "danger"}" data-act="retire" data-id="${p.id}" title="${p.retired ? "Volver a habilitarlo" : "Marcar como retirado"}">${p.retired ? "Reactivar" : "Retirar"}</button>` : ""}
              ${canManage ? `<button class="btn sm g danger" data-act="delp" data-id="${p.id}" title="Borrar jugador">×</button>` : ""}
            </div></td>
          </tr>`).join("") || `<tr><td colspan="6" class="muted tiny" style="padding:1rem">Sin jugadores todavía.</td></tr>`}
        </tbody>
      </table></div>
    </div>
    <div class="row tiny muted">
      <span>${n} confirmados de ${t.players.length}</span>

      ${canManage ? `<button class="btn sm g" data-act="autoseed">Siembra automática</button>
      <button class="btn sm g" data-act="shuffleseed">Siembra aleatoria</button>` : ""}
      ${adm && t.phase !== "reg" ? `<button class="btn sm g danger" data-act="rearm" title="Vuelve a armar las llaves con la lista actual. Borra los resultados.">Rearmar llaves</button>` : ""}
    </div>
    ${canManage && t.phase !== "reg" ? `<div class="tiny muted">Si agregás o sacás jugadores con el torneo empezado, ${adm ? `tocá <b>Rearmar llaves</b> para que la llave se reconstruya` : `pedile al organizador que rearme las llaves`} (se borran los resultados).</div>` : ""}
  </div>`;
}

function bracketRow(t, B, rounds, side, adm) {
  return `<div class="bracket ${side === "L" ? "losers" : "winners"}">
    ${rounds.map((ids, r) => {
      const last = r === rounds.length - 1;
      const n = ids.length;
      const nextN = r + 1 < rounds.length ? rounds[r + 1].length : 0;
      const conns = [];
      if (!last && nextN && n === nextN * 2) {
        for (let j = 0; j < nextN; j++) {
          const top = ((2 * j + 0.5) / n) * 100;
          const h = (1 / n) * 100;
          conns.push(`<span class="conn" style="top:${top}%;height:${h}%"></span>`);
        }
      }
      return `<div class="round ${last ? "last" : ""} ${r === 0 ? "first" : ""}">
        <h4>${side === "W" ? (last ? "Final de ganadores" : "Ganadores R" + (r + 1)) : "Perdedores R" + (r + 1)}</h4>
        <div class="ms">${ids.map(id => { const mm = B.matches[id]; if (!mm) console.warn("bracketRow: id sin partida", id, side); return matchCard(t, B, mm, true); }).join("")}${conns.join("")}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function bracketView(t, B, adm) {
  const view = S.ui.bview || "all";
  const showW = view !== "L";
  const showL = view !== "W" && B.format === "double";
  const gf = B.GF.map(id => B.matches[id]).filter(Boolean);
  return `
  <div class="bheadrow">
    <div class="tabs" role="tablist">
      <button class="tab" data-act="bview" data-view="all" aria-selected="${view === "all"}">Cuadro completo</button>
      <button class="tab" data-act="bview" data-view="W" aria-selected="${view === "W"}">Ganadores</button>
      ${B.format === "double" ? `<button class="tab" data-act="bview" data-view="L" aria-selected="${view === "L"}">Perdedores</button>` : ""}
    </div>
    <div class="row tiny muted" style="gap:.4rem;flex-wrap:wrap">
      <span class="badge">${playable(B).length} partidas pendientes</span>
      ${B.champ ? `<span class="badge ok">Campeón: ${esc(pidName(t, B.champ))}</span>` : ""}
      ${adm ? `<button class="btn sm g danger" data-act="resetbracket" title="Borra todos los resultados">Reiniciar llaves</button>` : ""}
    </div>
  </div>
  ${showW ? `<section class="bsection">
    <div class="bhead"><span class="bdot w"></span>Llave de ganadores</div>
    ${bracketRow(t, B, B.W, "W", adm)}
  </section>` : ""}
  ${showL ? `<section class="bsection">
    <div class="bhead"><span class="bdot l"></span>Llave de perdedores</div>
    ${B.L.length ? bracketRow(t, B, B.L, "L", adm) : `<div class="card tiny muted">Se arma a medida que caen jugadores de la llave de ganadores.</div>`}
  </section>` : ""}
  ${gf.length ? `<section class="bsection">
    <div class="bhead"><span class="bdot g"></span>Gran final</div>
    ${B.matches["GF-1"] ? `<div class="tiny muted" style="margin-bottom:.4rem">Ganó el retador en la primera final: se juega una final extra (reset).</div>` : ""}
    <div class="bracket gf">${gf.map(m => matchCard(t, B, m, true)).join("")}</div>
  </section>` : ""}
  `;
}

function tabBracket(t, B, champ, adm) {
  return bracketView(t, B, adm);
}

function matchCard(t, B, m, clickable) {
  if (!m) { console.warn("matchCard: partida inexistente", B && B.GF); return ""; }
  const no = m.no != null ? m.no : "";
  const lucky = m.a === BYE || m.b === BYE;
  if (lucky) {
    const who = m.a === BYE && m.b === BYE ? "—" : (m.a === BYE ? m.b : m.a);
    return `<div class="match done bye" style="cursor:default">
      <div class="mhead"><span class="mno">#${no}</span><span class="mrd">${matchLabel(m)}</span></div>
      <div class="p bye"><span class="s">–</span><span class="n">${esc(who && who !== BYE ? pidName(t, who) : "—")}</span><span class="c">pase directo</span></div>
    </div>`;
  }
  const cls = m.done ? "done" : (t.stream === m.id ? "live" : "");
  const p = (pid, i) => {
    const name = pid === BYE ? "BYE" : pid ? pidName(t, pid) : "—";
    const ch = pid && pid !== BYE ? (pidChar(t, pid) || "") : "";
    const won = m.done && pid && pid !== BYE && ((i === 0 && m.winner === "a") || (i === 1 && m.winner === "b"));
    const lost = m.done && !won && pid && pid !== BYE;
    const sc = m.done ? (i === 0 ? m.sa : m.sb) : "";
    return `<div class="p ${won ? "win" : ""} ${lost ? "lose" : ""} ${pid === BYE ? "bye" : ""}">
      <span class="s">${sc}</span>
      <span class="n"${clickable && pid && pid !== BYE ? ` data-act="player" data-id="${pid}" style="cursor:pointer"` : ""}>${esc(name)}${pid && pid !== BYE && isRetired(t, pid) ? ` <span class="badge warn">ret.</span>` : ""}</span>
      <span class="c">${esc(ch)}</span></div>`;
  };
  return `<div class="match ${cls}" data-act="match" data-id="${m.id}">
    <div class="mhead"><span class="mno">#${no}</span><span class="mrd">${matchLabel(m)}</span>${t.stream === m.id ? `<span class="badge live">EN VIVO</span>` : ""}</div>
    ${p(m.a, 0)}${p(m.b, 1)}
    <div class="mfoot"><span class="tiny muted">${m.done ? "Finalizada" : (!m.a || !m.b) ? "Esperando rival" : "Pendiente"}</span>${m.done && m.auto ? `<span class="badge warn">avance por retiro</span>` : ""}</div>
  </div>`;
}

    <form class="card grid" data-form="reg" style="gap:.7rem">

function regFields(t) {
  const r = t.regFields || {};
  return { char: r.char !== false, level: !!r.level };
}

function regTable(t) {
  const rf = regFields(t);
  const heads = ["Jugador"].concat(rf.char ? ["Personaje"] : []).concat(rf.level ? ["Nivel"] : []);
  const rows = t.players.slice().reverse().slice(0, 20).map(p => {
    const cells = [`<td>${esc(p.name)}${p.retired ? ` <span class="badge warn">Retirado</span>` : ""}</td>`];
    if (rf.char) cells.push(`<td class="tiny muted">${esc(p.char || "—")}</td>`);
    if (rf.level) cells.push(`<td class="tiny muted">${esc(p.level || "—")}</td>`);
    return `<tr>${cells.join("")}</tr>`;
  }).join("");
  return `<div class="card" style="padding:.2rem;margin-top:.9rem"><div style="overflow-x:auto"><table>
    <thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows || `<tr><td colspan="${heads.length}" class="muted tiny" style="padding:.9rem">Sé el primero en anotarte.</td></tr>`}</tbody>
  </table></div></div>`;
}

function regRows(t) {
  const rf = regFields(t);
  return t.players.slice().reverse().slice(0, 12).map(p => {
    const cells = [`<td>${esc(p.name)}</td>`];
    if (rf.char) cells.push(`<td class="tiny muted">${esc(p.char || "—")}</td>`);
    if (rf.level) cells.push(`<td class="tiny muted">${esc(p.level || "—")}</td>`);
    return `<tr>${cells.join("")}</tr>`;
  }).join("") || `<tr><td colspan="${1 + (rf.char ? 1 : 0) + (rf.level ? 1 : 0)}" class="muted tiny" style="padding:.9rem">Sé el primero en anotarte.</td></tr>`;
}

  </div>

    <a class="btn sm p" href="#/t/${t.id}/reg" style="align-self:flex-start">Inscribirme</a></div>`

function watchCols(t, B) {
  const cols = [];
  B.W.forEach((round, r) => cols.push({ title: r === B.W.length - 1 ? "Winners Final" : "Winners R" + (r + 1), ids: round }));
  if (B.format === "double") B.L.forEach((round, r) => cols.push({ title: "Losers R" + (r + 1), ids: round }));
  cols.push({ title: "Grand Final", ids: B.GF });
  return cols;
}

/* ---------------- overlay ---------------- */
function renderOverlay(t) {
  const q = new URLSearchParams(location.search);
  const layout = q.get("layout") === "full" ? "full" : "bar";
  if (q.get("bg") === "solid") { document.body.className = "overlay solid"; } else { document.body.className = "overlay"; }
  document.body.innerHTML = "";
  if (t.mode === "heat") return renderHeatOverlay(t, layout);
  const { B } = computeBracket(t);
  const play = playable(B);
  let m = t.stream && B.matches[t.stream] && !B.matches[t.stream].done ? B.matches[t.stream] : play[0];

/* ---------------- data helpers ---------------- */
function pidName(t, id) { if (id === BYE) return "BYE"; const p = t.players.find(x => x.id === id); return p ? p.name : "—"; }
function pidChar(t, id) { const p = t.players.find(x => x.id === id); return p ? (p.char || "") : ""; }

/* ---------------- QR ---------------- */
function qrInto(cv, text, W) {
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  if (typeof qrcode !== "function") { drawQRFallback(ctx, W); return; }
  const qr = qrcode(0, "M");          // versión automática, corrección M
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const cell = Math.max(1, Math.floor(W / n));
  const off = Math.floor((W - cell * n) / 2);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, W);
  ctx.fillStyle = "#0b0a10";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
  }
}
function drawQR(t) {
  if (location.protocol === "file:") {
    const cv = $("#qr"); if (cv && cv.getContext) drawQRFallback(cv.getContext("2d"), 150);
    return;
  }
  qrInto($("#qr"), linkOf(t.id, "reg"), 150);
}
function drawQRFallback(ctx, W) {
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, W);
  ctx.fillStyle = "#0b0a10"; ctx.font = "600 12px sans-serif";
  ctx.fillText("QR no disponible", 20, W / 2 - 6);
  ctx.fillText("usá el link", 40, W / 2 + 12);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const r = route();
  const t = r.t;

  if (act === "home") return go("#/");
  if (act === "settings") return go("#/settings");
  if (act === "copy") return copy(el.dataset.link);
  if (act === "tab") { S.ui.tab = el.dataset.tab; render(); return; }
  if (act === "bview") { S.ui.bview = el.dataset.view || "all"; render(); return; }
  if (act === "quickperson") {
    const f = document.querySelector("[data-form='addp']");
    const inp = f && f.querySelector("[name='name']");
    if (inp) { inp.value = el.dataset.name || ""; inp.focus(); }
    return;
  }
  if (act === "account") { if (t) openAccount(t); return; }
  if (act === "gotogate") { if (t) go("#/t/" + t.id + "/admin"); return; }
  if (act === "logout") {
    if (!t) return;
    const role = roleOf(t);
    if (role === "admin") delete S.owners[t.id];
    if (role === "judge") { if (S.judge) delete S.judge[t.id]; S.ui.judge = null; S.ui.judgeT = null; }
    if (role === "player" && S.me) delete S.me[t.id];
    saveDB(); closeModal(); render(); toast("Sesión cerrada");
    return;
  }
  if (act === "myqr") {
    if (!t) return;
    const p = playerOf(t, el.dataset.id);
    if (p) openPlayerQR(t, p);
    return;
  }
  if (act === "retire") {
    if (!t) return;
    const p = playerOf(t, el.dataset.id);
    if (!p) return;
    if (!p.retired) {
      if (!confirm(`¿Marcar a ${p.name} como retirado? Sus partidas pendientes se dan por perdidas.`)) return;
      p.retired = true;
      if (t.phase === "reg") p.in = false;
    } else {
      p.retired = false;
      if (t.phase === "reg") p.in = true;
    }
    settle(t); touch(t); closeModal(); render();
    toast(p.retired ? p.name + " queda retirado" : p.name + " vuelve a competir");
    return;
  }
  if (act === "call") {
    if (!t) return;
    const p = playerOf(t, el.dataset.id);
    if (p) { callPlayer(t, p.id, el.dataset.match || null); render(); }
    return;
  }
  if (act === "callmatch") {
    if (!t) return;
    const id = el.dataset.id;
    if (t.mode === "heat") {
      const m = computeHeat(t).all[id];
      if (m) m.players.forEach(pid => callPlayer(t, pid, id));
    } else {
      const m = computeBracket(t).B.matches[id];
      if (m) [m.a, m.b].filter(x => x && x !== BYE).forEach(pid => callPlayer(t, pid, id));
    }
    render();
    return;
  }
  if (act === "dismisscall") {
    if (!t) return;
    const pid = el.dataset.id, at = +(el.dataset.at || 0);
    S.callsSeen = S.callsSeen || {};
    S.callsSeen[t.id] = S.callsSeen[t.id] || {};
    S.callsSeen[t.id][pid] = at;
    saveDB(); render();
    return;
  }
  if (act === "notif") {
    if (!("Notification" in window)) return toast("Este navegador no soporta avisos");
    Notification.requestPermission().then(p => {
      toast(p === "granted" ? "Avisos activados" : "Avisos bloqueados");
      render();
    });
    return;
  }
  if (act === "export") {
    const blob = new Blob([JSON.stringify({ t: S.t }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "torneos.json";
    a.click();
    return;
  }
  if (act === "sync-now") { pullRemote(true); return; }
  if (act === "demo") { createDemo(); return; }
  if (act === "demoheat") { createDemoHeat(); return; }
  if (act === "del") {
    if (!confirm("¿Borrar el torneo y todos sus datos?")) return;
    const id = el.dataset.id;
    delete S.t[id]; delete S.owners[id]; saveDB();
    // marca de borrado en la nube para que no vuelva al sincronizar
    if (cfgOK()) {
      fetch(S.cfg.url + "/rest/v1/tournaments?on_conflict=id", {
        method: "POST",
        headers: Object.assign(headers(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify([{ id, data: { id, deleted: true, updatedAt: now() }, updated_at: new Date().toISOString() }]),
      }).catch(() => {});
    }
    render(); return;
  }
  if (!t) return;

  if (act === "pin") { gateSubmit(t); return; }
  if (act === "start") {
    const n = rosterOf(t).length;
    const fuera = t.players.length - n;
    if (n < 2) return toast("Necesitás al menos 2 jugadores con check-in");
    if (t.poolCount > 1 && n >= 4) {
      buildPools(t);
      t.phase = "pools";
      S.ui.tab = "pools";
      touch(t); render();
      toast(`Grupos sorteados${fuera > 0 ? ` · ${fuera} sin check-in quedaron afuera` : ""}`);
      return;
    }
    t.size = nextPow2(n);
    if (rosterOf(t).length < 3) t.format = "single";
    t.phase = "running"; t.results = {}; t.orders = {}; S.ui.tab = "bracket";
    touch(t); render();
    toast(fuera > 0 ? `Llaves generadas · ${fuera} sin check-in quedaron afuera` : "Llaves generadas");
    return;
  }
  if (act === "edit") { openEdit(t); return; }
  if (act === "jqr") {
    const j = (t.judges || []).find(x => x.id === el.dataset.id);
    if (j) openJudgeQR(t, j);
    return;
  }
  if (act === "chpass") {
    const v = prompt("Nueva contraseña de organizador (mín. 4 caracteres)", t.adminPass || "");
    if (v == null) return;
    const pass = v.trim();
    if (pass.length < 4) return toast("Mínimo 4 caracteres");
    t.adminPass = pass; touch(t); render(); toast("Contraseña actualizada");
    return;
  }
  if (act === "closepools") {
    const st = poolsStats(t);
    if (!st.done && !confirm(`Quedan ${st.total - st.played} partidas sin jugar. ¿Cerrar igual con la tabla actual?`)) return;
    if (t.pools.groups.every(g => standings(t, g).filter(r => r.w + r.l > 0).length === 0)) return toast("Jugá al menos una partida");
    closePools(t); touch(t); render(); toast("Bracket generado");
    return;
  }
  if (act === "poolmatch") { openPoolMatch(t, el.dataset.id); return; }
  if (act === "poolwin") {
    const need = Math.ceil((t.bestOf || 3) / 2);
    t.poolResults[el.dataset.id] = el.dataset.side === "a" ? [need, 0] : [0, need];
    touch(t); closeModal(); render();
    toast(poolsStats(t).done ? "Grupos completos · ya podés armar el bracket" : "Resultado guardado");
    return;
  }
  if (act === "poolsave") {
    const a = $("#modal [data-pscore='a']").value, b = $("#modal [data-pscore='b']").value;
    if (a === "" || b === "") return toast("Completá ambos marcadores");
    if (+a === +b) return toast("No puede haber empate en un pool");
    t.poolResults[el.dataset.id] = [+a, +b];
    touch(t); closeModal(); render();
    toast(poolsStats(t).done ? "Grupos completos · ya podés armar el bracket" : "Resultado guardado");
    return;
  }
  if (act === "poolclear") {
    delete t.poolResults[el.dataset.id]; touch(t); closeModal(); render(); return;
  }
  if (act === "close") { closeModal(); return; }
  if (act === "checkin") {
    const p = t.players.find(x => x.id === el.dataset.id);
    p.in = p.in === true ? false : true; touch(t); render(); return;
  }
  if (act === "allin") { t.players.forEach(p => p.in = true); touch(t); render(); return; }
  if (act === "autoseed") { seedApply(t, false); return; }
  if (act === "shuffleseed") { seedApply(t, true); return; }
  if (act === "delp") {
    if (t.phase !== "reg" && !confirm("El torneo está en curso. Se saca de la lista; después " + (roleOf(t) === "admin" ? "tocá «Rearmar llaves»" : "pedile al organizador que rearme las llaves") + " para actualizar la llave. ¿Seguir?")) return;
    t.players = t.players.filter(p => p.id !== el.dataset.id); touch(t); render(); return;
  }
  if (act === "deljudge") {
    t.judges = (t.judges || []).filter(j => j.id !== el.dataset.id); touch(t); render(); return;
  }
  if (act === "match") { openMatch(t, el.dataset.id); return; }
  if (act === "heat") { openHeat(t, el.dataset.id); return; }
  if (act === "heatpick") {
    const pid = el.dataset.id;
    const i = heatPick.indexOf(pid);
    if (i >= 0) heatPick.splice(i, 1); else heatPick.push(pid);
    paintHeat(t, computeHeat(t).all[heatOpen]);
    return;
  }
  if (act === "heatclear") { heatPick = []; paintHeat(t, computeHeat(t).all[heatOpen]); return; }
  if (act === "heatsave") {
    const m = computeHeat(t).all[el.dataset.id];
    if (!m) return;
    if (heatPick.length !== m.players.length) return toast("Ordená a todos los jugadores del grupo");
    t.orders = t.orders || {};
    t.orders[m.id] = heatPick.slice();
    if (t.stream === m.id) t.stream = null;
    settle(t); touch(t); closeModal(); render();
    toast(m.advance.length ? "Resultado guardado · pasa " + m.advance.map(p => pidName(t, p)).join(", ") : "Resultado guardado");
    return;
  }
  if (act === "heatdel") {
    delete t.orders[el.dataset.id];
    settle(t); touch(t); closeModal(); render(); toast("Resultado borrado");
    return;
  }
  if (act === "player") { openPlayer(t, el.dataset.id); return; }
  if (act === "leave") {
    if (S.judge) delete S.judge[t.id];
    S.ui.judge = null; S.ui.judgeT = null; saveDB(); render(); toast("Saliste del modo juez"); return;
  }
  if (act === "renp") {
    const p = t.players.find(x => x.id === el.dataset.id);
    if (!p) return;
    const v = prompt("Nombre del jugador", p.name);
    if (v == null) return;
    const name = v.trim();
    if (!name) return;
    p.name = name.slice(0, 24);
    touch(t); render(); toast("Nombre actualizado");
    return;
  }
  if (act === "rearm") {
    if (!confirm("¿Rearmar las llaves con la lista actual? Se borran todos los resultados.")) return;
    t.results = {}; t.orders = {}; t.stream = null;
    t.pools = null; t.qualified = null; t.poolResults = {};
    const n = rosterOf(t).length;
    if (t.mode !== "heat" && t.poolCount > 1 && n >= 4) {
      buildPools(t);
      t.phase = "pools";
      S.ui.tab = "pools";
    } else {
      t.phase = "running";
      if (t.mode !== "heat") t.size = nextPow2(n);
      settle(t);
      S.ui.tab = "bracket";
    }
    touch(t); render(); toast("Llaves rearmadas");
    return;
  }
  if (act === "quickwin") {
    const need = Math.ceil((t.bestOf || 3) / 2);
    t.results[el.dataset.id] = el.dataset.side === "a" ? [need, 0] : [0, need];
    if (t.stream === el.dataset.id) t.stream = null;
    settle(t); touch(t); closeModal(); render(); toast("Resultado guardado");
    return;
  }
  if (act === "resetbracket") {
    if (!confirm("¿Borrar todos los resultados y volver a empezar las llaves?")) return;
    t.results = {}; t.orders = {}; t.stream = null; settle(t); touch(t); render(); return;
  }
  if (act === "stream") {
    t.stream = t.stream === el.dataset.id ? null : el.dataset.id;
    touch(t); closeModal(); render(); toast(t.stream ? "Partida marcada para stream" : "Stream liberado"); return;
  }
  if (act === "spin") { spin(t); return; }
  if (act === "assignall") { assignAll(t); return; }
});
