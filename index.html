<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>Bracket — Gestor de torneos</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#08070c; --panel:#121019; --panel2:#181524; --line:#2a2436;
    --txt:#f3eefc; --dim:#9a92ad; --acc:#ff2e88; --acc2:#22d3ee;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --rad:14px;
  }
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(255,46,136,.14), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(34,211,238,.10), transparent 60%),
      var(--bg);
    color:var(--txt);
    font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc2);text-decoration:none}
  h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}
  .top{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,7,12,.82);backdrop-filter:blur(12px);z-index:40}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem}
  .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#ff7ab0 45%,var(--acc2));box-shadow:0 0 22px rgba(255,46,136,.45)}
  .top .sp{flex:1}
  .wrap{max-width:1180px;margin:0 auto;padding:1.1rem 1rem 4rem}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--rad);padding:1rem}
  .muted{color:var(--dim)}
  .tiny{font-size:.78rem}
  .label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .btn{appearance:none;border:1px solid var(--line);background:#1d1929;color:var(--txt);border-radius:10px;padding:.55rem .9rem;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#3d3450;background:#251f34}
  .btn:active{transform:translateY(1px)}
  .btn.p{background:linear-gradient(135deg,var(--acc),#ff5ca2);border-color:transparent;color:#170a11;box-shadow:0 6px 22px -10px rgba(255,46,136,.9)}
  .btn.p:hover{filter:brightness(1.08)}
  .btn.g{background:transparent}
  .btn.sm{padding:.35rem .6rem;font-size:.78rem;border-radius:8px}
  .btn.danger{color:#ffb4b4;border-color:#4a2530}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  input,select,textarea{font:inherit;background:#0e0c15;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.55rem .7rem;width:100%}
  input:focus,select,textarea:focus{outline:2px solid rgba(34,211,238,.35);outline-offset:-2px}
  .grid{display:grid;gap:.8rem}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:.35rem}
  .badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:#0d2018;background:var(--ok);border-color:transparent}
  .badge.live{color:#1a0710;background:var(--acc);border-color:transparent;animation:pulse 1.6s infinite}
  .badge.warn{color:#2a1d02;background:var(--warn);border-color:transparent}
  @keyframes pulse{50%{opacity:.55}}
  .tabs{display:flex;gap:.35rem;overflow-x:auto;padding:.2rem 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:transparent;border:1px solid transparent;color:var(--dim);padding:.45rem .8rem;border-radius:9px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:#1e1a2b;color:var(--txt);border-color:var(--line)}
  table{width:100%;border-collapse:collapse}
  th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:.5rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.9rem}
  tr:last-child td{border-bottom:0}
  .num{font-variant-numeric:tabular-nums}
  .pmatch{display:grid;grid-template-columns:1fr 22px 22px 1fr;gap:.3rem;align-items:center;background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:.3rem .45rem;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
  .pmatch:hover{border-color:#3d3450;background:#151120}
  .pmatch:disabled{cursor:default;opacity:.9}
  .pmatch .n{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmatch .s{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:.78rem;color:var(--dim)}
  .pmatch .s.w{color:var(--ok)}
  /* bracket */
  .bracket{display:flex;gap:1.4rem;overflow-x:auto;padding:.5rem .2rem 1rem;align-items:stretch}
  .bracket::-webkit-scrollbar{height:8px}
  .bracket::-webkit-scrollbar-thumb{background:#2e2740;border-radius:8px}
  .bracket::-webkit-scrollbar-track{background:transparent}
  .round{display:flex;flex-direction:column;min-width:220px;flex:0 0 auto}
  .round h4{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 .5rem;font-weight:800}
  .round .ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:.6rem}
  .match{border:1px solid var(--line);border-radius:11px;background:#121019;overflow:hidden;cursor:pointer;transition:.15s}
  .match:hover{border-color:#453a5c;transform:translateY(-1px)}
  .match.done{opacity:.82}
  .match.live{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,46,136,.35),0 8px 26px -14px var(--acc)}
  .p{display:flex;align-items:center;gap:.5rem;padding:.45rem .55rem;font-size:.84rem}
  .p + .p{border-top:1px solid rgba(255,255,255,.05)}
  .p .s{width:1.1rem;text-align:center;font-weight:800;color:var(--dim);font-size:.72rem}
  .p .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .p .c{font-size:.68rem;color:var(--dim);max-width:5.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p.win{background:linear-gradient(90deg,rgba(52,211,153,.16),transparent)}
  .p.win .s{color:var(--ok)}
  .p.lose{opacity:.5}
  .p.bye .n{color:var(--dim);font-style:italic}
  .empty{color:var(--dim);font-size:.78rem;padding:.5rem}
  .modal{position:fixed;inset:0;background:rgba(4,3,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -30px #000}
  .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#221c31;border:1px solid var(--line);padding:.6rem 1rem;border-radius:999px;font-size:.84rem;z-index:200;box-shadow:0 10px 30px -12px #000}
  .spin-name{font-size:clamp(2rem,9vw,4rem);font-weight:900;letter-spacing:-.03em;text-align:center;padding:1.5rem 0;min-height:1.4em}
  .spin-name.go{color:var(--acc2);text-shadow:0 0 30px rgba(34,211,238,.5)}
  .spin-name.done{color:var(--acc);text-shadow:0 0 40px rgba(255,46,136,.5)}
  .flash{animation:flash .5s}
  @keyframes flash{0%{background:rgba(52,211,153,.25)}100%{background:transparent}}
  body.overlay{background:transparent;overflow:hidden}
  body.overlay.solid{background:#0b0910}
  .ov{padding:2vw;display:grid;grid-template-columns:1.35fr .9fr;gap:2vw;height:100vh}
  .ov .main{border:1px solid rgba(255,255,255,.14);border-radius:1.2vw;padding:1.6vw;background:linear-gradient(160deg,rgba(255,46,136,.16),rgba(10,8,16,.82));display:flex;flex-direction:column;justify-content:center;gap:6vh}
  .ov .names{display:flex;align-items:center;justify-content:space-between;gap:1vw}
  .ov .who{font-size:2.6vw;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  .ov .ch{font-size:1.1vw;color:#c9c1da;letter-spacing:.1em;text-transform:uppercase}
  .ov .vs{font-size:1.4vw;color:var(--acc);font-weight:900;letter-spacing:.2em}
  .ov .side{background:rgba(8,7,12,.72);border:1px solid rgba(255,255,255,.1);border-radius:1.2vw;padding:1.2vw;overflow:hidden}
  /* lower third para OBS */
  .ovbar{position:fixed;left:0;right:0;bottom:0;padding:2.2vw 2.4vw;display:flex;align-items:flex-end;gap:1.4vw}
  .ovbar .board{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5vw;
    background:linear-gradient(90deg,rgba(255,46,136,.22),rgba(9,7,14,.92) 22%,rgba(9,7,14,.92) 78%,rgba(34,211,238,.18));
    border:1px solid rgba(255,255,255,.14);border-radius:.9vw;padding:1.1vw 1.8vw;
    box-shadow:0 2vw 4vw -2vw rgba(0,0,0,.9)}
  .ovbar .pn{font-size:2.5vw;font-weight:900;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovbar .pc{font-size:.95vw;letter-spacing:.22em;text-transform:uppercase;color:#bdb4d0;margin-top:.3vw}
  .ovbar .b{text-align:right}
  .ovbar .mid{text-align:center;min-width:8vw}
  .ovbar .vs{font-size:1.3vw;font-weight:900;letter-spacing:.25em;color:var(--acc)}
  .ovbar .rd{font-size:.8vw;letter-spacing:.2em;text-transform:uppercase;color:#9a92ad;margin-top:.3vw;white-space:nowrap}
  .ovbar .next{width:20vw;background:rgba(9,7,14,.85);border:1px solid rgba(255,255,255,.1);border-radius:.9vw;padding:.9vw 1.1vw}
  .ovbar .next .hd{font-size:.72vw;letter-spacing:.24em;text-transform:uppercase;color:#8d85a0;margin-bottom:.5vw}
  .ovbar .next .r{display:flex;justify-content:space-between;gap:.6vw;font-size:.9vw;padding:.3vw 0;border-top:1px solid rgba(255,255,255,.07)}
  .ovbar .next .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){
    .bracket{gap:1rem}
    .round{min-width:200px}
    .ov{grid-template-columns:1fr;height:auto}
    .ov .who{font-size:6vw}.ov .ch{font-size:2.6vw}.ov .vs{font-size:3vw}
    .ovbar{flex-direction:column;align-items:stretch;padding:4vw}
    .ovbar .pn{font-size:6vw}.ovbar .pc,.ovbar .rd{font-size:2.4vw}.ovbar .vs{font-size:3vw}
    .ovbar .next{width:auto}.ovbar .next .r{font-size:2.6vw}
  }
</style>
</head>
<body>
<header class="top">
  <div class="mark"></div>
  <div class="brand">Bracket</div>
  <div class="sp"></div>
  <button class="btn g sm" data-act="home">Torneos</button>
  <button class="btn g sm" data-act="settings">⚙︎</button>
</header>
<main class="wrap" id="app"></main>
<div id="modal"></div>

<script>
/* qrcode-generator 1.4.4 - MIT - (c) 2009 Kazuhiko Arase - http://www.d-project.com/ */

// QR Code Generator for JavaScript

// Copyright (c) 2009 Kazuhiko Arase

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;

/* ============================================================
   MOTOR DE BRACKETS
   ============================================================ */
function nextPow2(n) { let s = 2; while (s < n) s *= 2; return Math.max(2, s); }

/* orden clásico de siembra: [1,8,4,5,2,7,3,6] */
function seedOrder(n) {
  let arr = [1, 2];
  while (arr.length < n) {
    const len = arr.length * 2, out = [];
    for (const s of arr) { out.push(s); out.push(len + 1 - s); }
    arr = out;
  }
  return arr;
}

function buildStructure(size, format) {
  const k = log2(size), M = {}, W = [], L = [];
  for (let r = 0; r < k; r++) {
    W[r] = [];
    const cnt = size / 2 ** (r + 1);
    for (let i = 0; i < cnt; i++) {
      const id = "W" + r + "-" + i;
      W[r].push(id);
      M[id] = { id, side: "W", round: r, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
    }
  }
  for (let r = 0; r < k; r++) for (let i = 0; i < W[r].length; i++) {
    const m = M[W[r][i]];
    if (r < k - 1) m.nextWin = [W[r + 1][Math.floor(i / 2)], i % 2 ? "b" : "a"];
    else m.nextWin = ["GF-0", "a"];
    if (format === "double") {
      if (r === 0) m.nextLose = ["L0-" + Math.floor(i / 2), i % 2 ? "b" : "a"];
      else if (r < k - 1) m.nextLose = ["L" + (2 * r - 1) + "-" + (W[r].length - 1 - i), "b"];
      else m.nextLose = ["L" + (2 * k - 3) + "-0", "b"];
    }
  }
  if (format === "double" && k >= 2) {
    const total = 2 * k - 2;
    let s = Math.max(1, size / 4), j = 0;
    while (j < total) {
      L[j] = [];
      for (let i = 0; i < s; i++) {
        const id = "L" + j + "-" + i;
        L[j].push(id);
        M[id] = { id, side: "L", round: j, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
      }
      if (j + 1 < total) {
        L[j + 1] = [];
        for (let i = 0; i < s; i++) {
          const id = "L" + (j + 1) + "-" + i;
          L[j + 1].push(id);
          M[id] = { id, side: "L", round: j + 1, idx: i, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
        }
      }
      j += 2;
      if (j < total) s = Math.max(1, s / 2);
    }
    for (let r = 0; r < total; r++) for (let i = 0; i < L[r].length; i++) {
      const m = M[L[r][i]];
      if (r % 2 === 0) m.nextWin = r + 1 < total ? [L[r + 1][i], "a"] : ["GF-0", "b"];
      else m.nextWin = r + 1 < total ? [L[r + 1][Math.floor(i / 2)], i % 2 ? "b" : "a"] : ["GF-0", "b"];
    }
  }
  M["GF-0"] = { id: "GF-0", side: "GF", round: 0, idx: 0, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
  return { matches: M, W, L, GF: ["GF-0"], format, size };
}

function rosterOf(t) {
  if (t.qualified && t.qualified.length) {
    return t.qualified.map(id => t.players.find(p => p.id === id)).filter(Boolean);
  }
  return t.players.filter(p => p.in !== false).slice().sort((a, b) =>
    (a.seed == null ? 1e9 : a.seed) - (b.seed == null ? 1e9 : b.seed) || a.createdAt - b.createdAt);
}

/* ============================================================
   FASE DE GRUPOS (round robin simple, estilo pools de EVO)
   ============================================================ */
const POOL_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

/* parejas todos contra todos (método del círculo) */
function rrPairs(ids) {
  const list0 = ids.slice();
  if (list0.length % 2) list0.push(null);
  const n = list0.length, out = [];
  let list = list0.slice();
  for (let r = 0; r < n - 1; r++) {
    for (let i = 0; i < n / 2; i++) {
      const a = list[i], b = list[n - 1 - i];
      if (a && b) out.push([a, b]);
    }
    list = [list[0]].concat([list[n - 1]], list.slice(1, n - 1));
  }
  return out;
}

function buildPools(t) {
  const count = Math.max(2, +t.poolCount || 4);
  const roster = rosterOf(t);
  const groups = [];
  for (let i = 0; i < count; i++) {
    groups.push({ id: "g" + i, name: "Pool " + (POOL_LETTERS[i] || i + 1), players: [] });
  }
  /* reparto en serpiente: 1→A 2→B 3→C 4→C 5→B 6→A ... los mejores no se cruzan */
  roster.forEach((p, idx) => {
    const round = Math.floor(idx / count), pos = idx % count;
    const gi = round % 2 === 0 ? pos : count - 1 - pos;
    groups[gi].players.push(p.id);
  });
  groups.forEach(g => {
    g.matches = rrPairs(g.players).map((pr, i) => ({ id: g.id + "-" + i, a: pr[0], b: pr[1] }));
  });
  t.pools = { groups, advance: clamp(+t.advance || 2, 1, 4) };
  t.poolResults = {};
  t.qualified = null;
}

function standings(t, g) {
  const rows = g.players.map(pid => ({ pid, w: 0, l: 0, sw: 0, sl: 0, diff: 0 }));
  const map = {};
  rows.forEach(r => { map[r.pid] = r; });
  (g.matches || []).forEach(m => {
    const res = (t.poolResults || {})[m.id];
    if (!res) return;
    const A = map[m.a], B = map[m.b];
    if (!A || !B) return;
    A.sw += res[0]; A.sl += res[1];
    B.sw += res[1]; B.sl += res[0];
    if (res[0] > res[1]) { A.w++; B.l++; } else { B.w++; A.l++; }
  });
  rows.forEach(r => { r.diff = r.sw - r.sl; });
  rows.sort((x, y) => y.w - x.w || y.diff - x.diff || x.pid.localeCompare(y.pid));
  return rows;
}

function poolsStats(t) {
  if (!t.pools) return { total: 0, played: 0, done: false };
  let total = 0, played = 0;
  t.pools.groups.forEach(g => {
    total += (g.matches || []).length;
    (g.matches || []).forEach(m => { if ((t.poolResults || {})[m.id]) played++; });
  });
  return { total, played, done: played >= total };
}

function closePools(t) {
  const adv = t.pools.advance;
  const winners = [], others = [];
  t.pools.groups.forEach(g => {
    const st = standings(t, g);
    for (let r = 0; r < adv; r++) {
      if (!st[r]) continue;
      if (r === 0) winners.push(st[r].pid); else others.push(st[r].pid);
    }
  });
  // ganadores de cada pool primero (cabeza de serie), después los segundos
  t.qualified = winners.concat(others);
  t.size = nextPow2(t.qualified.length);
  t.phase = "running";
  t.results = {};
  t.stream = null;
  S.ui.tab = "bracket";
}

function computeBracket(t) {
  const size = t.size || nextPow2(t.players.length || 2);
  const B = buildStructure(size, t.format);
  const roster = rosterOf(t);
  const ord = seedOrder(size);
  for (let i = 0; i < B.W[0].length; i++) {
    const m = B.matches[B.W[0][i]];
    const s1 = ord[i * 2], s2 = ord[i * 2 + 1];
    m.a = s1 <= roster.length ? roster[s1 - 1].id : BYE;
    m.b = s2 <= roster.length ? roster[s2 - 1].id : BYE;
  }
  const results = t.results || {};
  let guard = 0, changed = true;
  while (changed && guard++ < 4000) {
    changed = false;
    for (const m of Object.values(B.matches)) {
      if (m.done) continue;
      if (m.a && m.b && (m.a === BYE || m.b === BYE)) {
        resolve(B, t, m, m.a === BYE ? 0 : 1, m.b === BYE ? 0 : 1);
        changed = true;
      } else if (m.a && m.b && m.a !== BYE && m.b !== BYE && results[m.id]) {
        const r = results[m.id];
        if (+r[0] !== +r[1]) { resolve(B, t, m, +r[0], +r[1]); changed = true; }
      }
    }
  }
  let champ = null;
  if (t.format === "single") {
    const fin = B.matches[B.W[B.W.length - 1][0]];
    champ = fin.done ? fin.winPid : null;
  } else {
    const g1 = B.matches["GF-1"];
    if (g1) champ = g1.done ? g1.winPid : null;          // hay reset: falta jugarla
    else if (B.matches["GF-0"].done) champ = B.matches["GF-0"].winPid;
  }
  if (champ === BYE) champ = null;
  const losses = {};
  for (const m of Object.values(B.matches)) {
    if (!m.done || !m.winPid) continue;
    const lp = m[m.winner === "a" ? "b" : "a"];
    if (lp && lp !== BYE) losses[lp] = (losses[lp] || 0) + 1;
  }
  return { B, champ, losses, roster };
}

function resolve(B, t, m, sa, sb) {
  m.sa = sa; m.sb = sb; m.done = true;
  const aWins = sa > sb;
  m.winner = aWins ? "a" : "b";
  const wp = m[aWins ? "a" : "b"];
  const lp = m[aWins ? "b" : "a"];
  m.winPid = wp;
  const put = (ref, pid) => {
    if (!ref || !pid) return;
    const nm = B.matches[ref[0]];
    if (nm && !nm.done) nm[ref[1]] = pid;
  };
  put(m.nextWin, wp);
  if (m.nextLose && lp) put(m.nextLose, lp);
  if (m.id === "GF-0" && t.format === "double" && m.winner === "b") {
    if (!B.matches["GF-1"]) {
      B.matches["GF-1"] = { id: "GF-1", side: "GF", round: 1, idx: 0, a: null, b: null, sa: 0, sb: 0, done: false, winner: null, winPid: null };
      B.GF.push("GF-1");
    }
    const g = B.matches["GF-1"];
    if (!g.done) { g.a = lp; g.b = wp; }
  }
}

function playable(B) {
  return Object.values(B.matches).filter(m => !m.done && m.a && m.b && m.a !== BYE && m.b !== BYE);
}
function byId(t) {
  const map = {};
  for (const p of t.players) map[p.id] = p;
  return map;
}
function matchLabel(m) {
  if (m.side === "W") return m.round === 0 ? "Winners R1" : (m.nextWin && m.nextWin[0] === "GF-0" ? "Winners Final" : "Winners R" + (m.round + 1));
  if (m.side === "L") return "Losers R" + (m.round + 1);
  return m.id === "GF-0" ? "Grand Final" : "Grand Final · Reset";
}

   RENDER

function render() {

  if (r.name === "overlay") { renderOverlay(r.t); return; }

}

            <span class="badge ${t.phase === "running" ? "live" : ""}">${st}</span>
            <span class="tiny muted num">${n} ${n === 1 ? "inscripto" : "inscriptos"}</span>
          </div>
          <div style="font-weight:800;font-size:1.05rem">${esc(t.name)}</div>
          <div class="tiny muted">${esc(t.game || "—")} · ${t.format === "double" ? "Doble eliminación" : "Eliminación directa"} · ${t.phase === "reg" ? (t.cap ? "Cupo " + t.cap : "Sin cupo") : "Bracket de " + t.size}</div>
          <div class="row" style="margin-top:.3rem">
            <a class="btn sm p" href="#/t/${t.id}">Abrir</a>

            <button class="btn sm g danger" data-act="del" data-id="${t.id}">Borrar</button>
          </div>

      }).join("")}</div>` : `<div class="card muted tiny">Todavía no hay torneos. Creá el primero arriba o tocá <b>Ver torneo de ejemplo</b> para mirar uno terminado.</div>`}

}

/* ---------------- tournament ---------------- */
function phaseOf(t, champ) {
  if (t.phase === "reg") return "reg";
  if (t.phase === "pools") return "pools";
  return champ ? "done" : "running";
}

function renderTournament(t) {
  const adm = isAdmin(t);
  const judge = S.ui.judge && S.ui.judgeT === t.id;
  if (!adm && !judge) return renderGate(t);
  const tab0 = S.ui.tab || "resumen";
  const tab = (!adm && (tab0 === "jueces" || tab0 === "ruleta")) ? "resumen" : tab0;
  const { B, champ } = computeBracket(t);
  const ph = phaseOf(t, champ);
  const roster = rosterOf(t);
  const n = roster.length;

  const head = `
  <div class="row" style="justify-content:space-between;align-items:flex-start;gap:1rem">
    <div>
      <div class="row" style="gap:.5rem">
        <span class="badge ${ph === "running" ? "live" : ""}">${ph === "running" ? "En curso" : ph === "done" ? "Finalizado" : ph === "pools" ? "Fase de grupos" : "Inscripción"}</span>
        <span class="badge">${t.format === "double" ? "Doble elim." : "Simple elim."}</span>
        <span class="badge">BO${t.bestOf}</span>
        ${judge && !adm ? `<span class="badge warn">Juez</span>` : ""}
      </div>
      <h1 style="font-size:clamp(1.4rem,4.5vw,2rem);margin-top:.45rem">${esc(t.name)}</h1>
      <div class="muted tiny">${esc(t.game || "—")} · ${t.players.length} inscriptos · ${n} en llaves · ${ph === "reg" ? (t.cap ? "Cupo " + t.cap : "Sin cupo fijo") : "Bracket de " + t.size}</div>
    </div>
    <div class="row">
      ${ph === "reg" && adm ? `<button class="btn p" data-act="start" ${n < 2 ? "disabled" : ""}>${t.poolCount ? "Sortear grupos" : "Iniciar torneo"}</button>` : ""}
      <button class="btn sm g" data-act="edit">Editar</button>
      <button class="btn g sm" data-act="copy" data-link="${linkOf(t.id, "reg")}">Link de inscripción</button>
    </div>
  </div>
  <div class="tabs" style="margin:.9rem 0 .8rem">
    ${[["resumen", "Resumen"]]
      .concat(t.pools ? [["pools", "Pools"]] : [])
      .concat([["jugadores", "Jugadores"], ["bracket", "Bracket"]])
      .concat(adm ? [["ruleta", "Ruleta"], ["jueces", "Jueces"]] : [])
      .map(([k, l]) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}
  </div>`;

  let body = "";
  if (tab === "resumen") body = tabResumen(t, B, champ, n, adm, ph);
  if (tab === "pools") body = tabPools(t, adm);
  if (tab === "jugadores") body = tabPlayers(t, n, adm);
  if (tab === "bracket") body = ph === "pools" ? tabBracketPending(t) : tabBracket(t, B, champ, adm);
  if (tab === "ruleta") body = tabRoulette(t);
  if (tab === "jueces") body = tabJudges(t);

  $("#app").innerHTML = head + body;
  if (tab === "resumen") drawQR(t);
}

function tabResumen(t, B, champ, n, adm, ph) {
  const url = linkOf(t.id, "reg");
  const play = playable(B);
  const next = play.filter(m => !t.stream || m.id !== t.stream).slice(0, 4);
  return `
  <div class="grid" style="grid-template-columns:minmax(0,1fr);gap:.9rem;max-width:900px">
    ${champ ? `<div class="card" style="background:linear-gradient(120deg,rgba(255,46,136,.22),rgba(18,16,25,.9));border-color:#4a2440">
      <div class="label">Campeón</div>
      <div style="font-size:1.8rem;font-weight:900;margin-top:.2rem">${esc(pidName(t, champ))}</div>
    </div>` : ""}    <div class="card grid" style="grid-template-columns:auto 1fr;gap:1rem;align-items:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:.35rem">
        <div style="background:#fff;padding:.4rem;border-radius:10px;line-height:0"><canvas id="qr" width="150" height="150"></canvas></div>
        <div class="tiny muted" style="max-width:150px;text-align:center;word-break:break-all;font-size:.65rem">${location.protocol === "file:" ? "Publicá la app en una URL (GitHub Pages) para que el QR funcione" : esc(url.replace(/^https?:\/\//, ""))}</div>
      </div>
      <div class="grid" style="gap:.4rem">
        <div class="label">Inscripción con QR</div>
        <div class="tiny muted">Los jugadores escanean y se inscriben solos. El contador se actualiza en vivo.</div>
        <div class="row">
          <span class="badge ok">${t.players.length} inscriptos</span>
          <span class="badge">${n} con check-in</span>
        </div>
        <div class="row" style="margin-top:.2rem">
          <button class="btn sm" data-act="copy" data-link="${url}">Copiar link</button>
          <button class="btn sm g" data-act="copy" data-link="${linkOf(t.id, "watch")}">Bracket público</button>
          <button class="btn sm g" data-act="copy" data-link="${linkOf(t.id, "overlay")}">Overlay OBS</button>
        </div>
      </div>
    </div>
    ${ph === "reg" ? `<div class="card grid" style="gap:.6rem">
      <div class="label">Paso siguiente</div>
      <div class="tiny muted">Cuando terminen de anotarse: cerrá el registro, hacé el check-in de los presentes y ${t.poolCount ? "sorteá los grupos" : "generá las llaves"}.</div>
      <div class="row">${adm ? `<button class="btn p" data-act="start" ${n < 2 ? "disabled" : ""}>${t.poolCount ? `Sortear grupos (${n})` : `Iniciar torneo (${n})`}</button>` : `<span class="tiny muted">Esperando al organizador.</span>`}</div>
    </div>` : ph === "pools" ? (() => {
      const ps = poolsStats(t);
      const pct = ps.total ? Math.round(ps.played / ps.total * 100) : 0;
      return `<div class="card grid" style="gap:.6rem">
        <div class="row" style="justify-content:space-between"><div class="label">Fase de grupos</div>
          <span class="tiny muted">${ps.played}/${ps.total} partidas · pasan ${t.pools.advance} por pool</span></div>
        <div style="height:6px;background:#1b1726;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s"></div></div>
        <div class="row">
          <button class="btn p" data-act="tab" data-tab="pools">Ver los pools</button>
          ${adm ? `<button class="btn g" data-act="closepools">Cerrar grupos y armar bracket</button>` : ""}
        </div>
      </div>`;
    })() : `
    <div class="card grid" style="gap:.5rem">
      <div class="row" style="justify-content:space-between"><div class="label">Próximas partidas</div>
        <span class="tiny muted">${play.length} pendientes</span></div>
      ${next.length ? next.map(m => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:.45rem">
        <div class="tiny">${esc(pidName(t, m.a))} <span class="muted">vs</span> ${esc(pidName(t, m.b))}</div>
        <div class="row"><span class="badge">${matchLabel(m)}</span>
        <button class="btn sm g" data-act="match" data-id="${m.id}">Reportar</button></div>
      </div>`).join("") : `<div class="tiny muted">Sin partidas pendientes.</div>`}
    </div>`}
  </div>`;
}

function tabBracketPending(t) {
  const st = poolsStats(t);
  return `<div class="card grid" style="gap:.6rem;max-width:620px">
    <div class="label">Bracket</div>
    <div class="tiny muted">La llave se arma cuando cierres la fase de grupos. Clasifican ${t.pools ? t.pools.advance : 2} por pool (${st.played}/${st.total} partidas jugadas).</div>
    <div class="row"><button class="btn p" data-act="tab" data-tab="pools">Ir a los pools</button></div>
  </div>`;
}

function poolsEditable(t) {
  return t.phase === "pools" || (t.phase === "running" && !Object.keys(t.results || {}).length);
}

function tabPools(t, adm) {
  const P = t.pools;
  if (!P) return `<div class="card muted tiny">Este torneo no tiene fase de grupos.</div>`;
  const st = poolsStats(t);
  const pct = st.total ? Math.round(st.played / st.total * 100) : 0;
  const editable = poolsEditable(t);
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:.7rem;gap:.6rem">
    <div class="row">
      <span class="badge">${P.groups.length} pools</span>
      <span class="badge">pasan ${P.advance} por pool</span>
      <span class="badge ${st.done ? "ok" : ""}">${st.played}/${st.total} partidas</span>
    </div>
    ${(editable && adm) ? `<button class="btn p" data-act="closepools">${t.phase === "pools" ? "Cerrar grupos y armar bracket" : "Volver a armar el bracket"}</button>` : ""}
  </div>
  ${t.phase === "pools" ? `<div style="height:5px;background:#1b1726;border-radius:99px;overflow:hidden;margin-bottom:.8rem">
    <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s"></div></div>` : ""}
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:.8rem">
    ${P.groups.map(g => poolCard(t, g, P.advance, editable)).join("")}
  </div>`;
}

function poolCard(t, g, adv, editable) {
  const st = standings(t, g);
  return `<div class="card" style="padding:.75rem">
    <div class="row" style="justify-content:space-between;margin-bottom:.35rem">
      <b style="font-size:.95rem">${esc(g.name)}</b>
      <span class="tiny muted">${g.players.length} jugadores</span>
    </div>
    <table style="margin-bottom:.55rem">
      <thead><tr><th style="width:18px"></th><th>Jugador</th><th style="width:24px">G</th><th style="width:24px">P</th><th style="width:34px">Dif</th></tr></thead>
      <tbody>
        ${st.map((r, i) => `<tr>
          <td class="tiny" style="${i < adv ? "color:var(--ok);font-weight:800" : "color:var(--dim)"}">${i + 1}</td>
          <td style="font-size:.84rem;${i < adv ? "font-weight:700" : ""}">${esc(pidName(t, r.pid))}</td>
          <td class="num tiny">${r.w}</td><td class="num tiny">${r.l}</td>
          <td class="num tiny">${r.diff > 0 ? "+" : ""}${r.diff}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="grid" style="gap:.25rem">
      ${g.matches.map(m => {
        const res = (t.poolResults || {})[m.id];
        return `<button class="pmatch" data-act="poolmatch" data-id="${m.id}" ${editable ? "" : "disabled"}>
          <span class="n">${esc(pidName(t, m.a))}</span>
          <span class="s ${res && res[0] > res[1] ? "w" : ""}">${res ? res[0] : "–"}</span>
          <span class="s ${res && res[1] > res[0] ? "w" : ""}">${res ? res[1] : "–"}</span>
          <span class="n" style="text-align:right">${esc(pidName(t, m.b))}</span>
        </button>`;
      }).join("") || `<div class="tiny muted">Sin partidas (pool de 1).</div>`}
    </div>
  </div>`;
}

function tabPlayers(t, n, adm) {
  const roster = rosterOf(t);
  const map = {};
  t.players.forEach(p => map[p.id] = p);
  return `
  <div class="grid" style="gap:.8rem;max-width:900px">
    ${adm ? `<form class="card row" data-form="addp" style="align-items:flex-end">
      <div class="field" style="flex:1;min-width:140px"><span class="tiny muted">Nombre</span><input name="name" placeholder="Agregar jugador" required maxlength="24"></div>
      <div class="field" style="width:120px"><span class="tiny muted">Personaje</span><input name="char" maxlength="18" placeholder="—"></div>
      <button class="btn" type="submit">Agregar</button>
    </form>` : ""}

    <div class="card" style="padding:.2rem">
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th style="width:44px">Seed</th><th>Jugador</th><th>Personaje</th><th style="width:90px">Check-in</th><th style="width:40px"></th></tr></thead>
        <tbody>
        ${roster.concat(t.players.filter(p => p.in === false)).map(p => `
          <tr>
            <td><input class="num" style="width:52px;padding:.25rem .35rem;text-align:center" data-act="seed" data-id="${p.id}" value="${p.seed || ""}" ${(t.phase !== "reg" || !adm) ? "disabled" : ""}></td>
            <td><b>${esc(p.name)}</b>${p.tag ? ` <span class="muted tiny">${esc(p.tag)}</span>` : ""}</td>
            <td class="tiny muted">${esc(p.char || "—")}</td>
            <td><button class="btn sm ${p.in === true ? "p" : "g"}" data-act="checkin" data-id="${p.id}">${p.in === true ? "Presente" : "Ausente"}</button></td>
            <td>${adm ? `<button class="btn sm g danger" data-act="delp" data-id="${p.id}">×</button>` : ""}</td>
          </tr>`).join("") || `<tr><td colspan="5" class="muted tiny" style="padding:1rem">Sin jugadores todavía.</td></tr>`}
        </tbody>
      </table></div>
    </div>
    <div class="row tiny muted">
      <span>${n} confirmados de ${t.players.length}</span>
      <button class="btn sm g" data-act="allin">Marcar todos presentes</button>
      ${adm ? `<button class="btn sm g" data-act="autoseed">Siembra automática</button>
      <button class="btn sm g" data-act="shuffleseed">Siembra aleatoria</button>` : ""}
    </div>
  </div>`;
}

function tabBracket(t, B, champ, adm) {
  const cols = [];
  B.W.forEach((round, r) => cols.push({ title: r === B.W.length - 1 ? "Winners Final" : "Winners R" + (r + 1), ids: round }));
  if (B.format === "double") B.L.forEach((round, r) => cols.push({ title: "Losers R" + (r + 1), ids: round }));
  cols.push({ title: "Grand Final", ids: B.GF });
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:.6rem">
    <div class="row">
      <span class="badge">${playable(B).length} partidas pendientes</span>
      ${champ ? `<span class="badge ok">Campeón: ${esc(pidName(t, champ))}</span>` : ""}
    </div>
    ${adm ? `<button class="btn sm g danger" data-act="resetbracket" title="Borra todos los resultados">Reiniciar llaves</button>` : ""}
  </div>
  <div class="bracket">
    ${cols.map(c => `<div class="round"><h4>${c.title}</h4><div class="ms">
      ${c.ids.map(id => matchCard(t, B, B.matches[id])).join("")}
    </div></div>`).join("")}
  </div>`;
}

function matchCard(t, B, m) {
  const lucky = m.a === BYE || m.b === BYE;
  if (lucky) {
    const who = m.a === BYE && m.b === BYE ? "—" : (m.a === BYE ? m.b : m.a);
    return `<div class="match done" style="cursor:default;opacity:.75">
      <div class="p" style="padding:.3rem .55rem">
        <span class="n" style="font-size:.8rem">${esc(who === BYE ? "—" : who ? pidName(t, who) : "—")}</span>
        <span class="c">pase directo</span>
      </div>
    </div>`;
  }
  const cls = m.done ? "done" : (t.stream === m.id ? "live" : "");
  const p = (pid, i) => {
    const name = pid === BYE ? "BYE" : pid ? pidName(t, pid) : "—";
    const ch = pid && pid !== BYE ? (pidChar(t, pid) || "") : "";
    const won = m.done && pid && pid !== BYE && ((i === 0 && m.winner === "a") || (i === 1 && m.winner === "b"));
    const lost = m.done && !won && pid && pid !== BYE;
    const sc = m.done ? (i === 0 ? m.sa : m.sb) : "";
    return `<div class="p ${won ? "win" : ""} ${lost ? "lose" : ""} ${pid === BYE ? "bye" : ""}">
      <span class="s">${sc}</span><span class="n">${esc(name)}</span><span class="c">${esc(ch)}</span></div>`;
  };
  return `<div class="match ${cls}" data-act="match" data-id="${m.id}">
    ${p(m.a, 0)}${p(m.b, 1)}
    <div class="p" style="border-top:1px solid rgba(255,255,255,.06);padding:.2rem .55rem">
      <span class="tiny muted" style="flex:1">${matchLabel(m)}</span>
      ${t.stream === m.id ? `<span class="badge live">EN VIVO</span>` : ""}
    </div>
  </div>`;
}

function tabRoulette(t) {
  return `

    <div class="card grid" style="gap:.6rem">

}

function tabJudges(t) {

  <div class="grid" style="gap:.9rem;max-width:760px">

/* ---------------- public views ---------------- */
function renderReg(t) {
  const n = t.players.length;

}

/* ---------------- data helpers ---------------- */
function pidName(t, id) { if (id === BYE) return "BYE"; const p = t.players.find(x => x.id === id); return p ? p.name : "—"; }
function pidChar(t, id) { const p = t.players.find(x => x.id === id); return p ? (p.char || "") : ""; }

/* ---------------- QR ---------------- */
function drawQR(t) {
  const cv = $("#qr");
  if (!cv || !cv.getContext) return;
  const url = linkOf(t.id, "reg");
  const ctx = cv.getContext("2d");
  const W = 150;
  if (typeof qrcode !== "function" || location.protocol === "file:") { drawQRFallback(ctx, W); return; }
  const qr = qrcode(0, "M");          // versión automática, corrección M
  qr.addData(url);
  qr.make();
  const n = qr.getModuleCount();
  const cell = Math.max(1, Math.floor(W / n));
  const off = Math.floor((W - cell * n) / 2);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, W);
  ctx.fillStyle = "#0b0a10";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
  }
}
function drawQRFallback(ctx, W) {
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, W);
  ctx.fillStyle = "#0b0a10"; ctx.font = "600 12px sans-serif";
  ctx.fillText("QR no disponible", 20, W / 2 - 6);
  ctx.fillText("usá el link", 40, W / 2 + 12);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const r = route();
  const t = r.t;

  if (act === "home") return go("#/");
  if (act === "settings") return go("#/settings");
  if (act === "copy") return copy(el.dataset.link);
  if (act === "tab") { S.ui.tab = el.dataset.tab; render(); return; }
  if (act === "export") {
    const blob = new Blob([JSON.stringify({ t: S.t }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "torneos.json";
    a.click();
    return;
  }
  if (act === "sync-now") { pullRemote(true); return; }
  if (act === "demo") { createDemo(); return; }
  if (act === "del") {
    if (!confirm("¿Borrar el torneo y todos sus datos?")) return;
    const id = el.dataset.id;
    delete S.t[id]; delete S.owners[id]; saveDB();
    // marca de borrado en la nube para que no vuelva al sincronizar
    if (cfgOK()) {
      fetch(S.cfg.url + "/rest/v1/tournaments?on_conflict=id", {
        method: "POST",
        headers: Object.assign(headers(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify([{ id, data: { id, deleted: true, updatedAt: now() }, updated_at: new Date().toISOString() }]),
      }).catch(() => {});
    }
    render(); return;
  }
  if (!t) return;

  if (act === "pin") {
    const v = ($("#pin") || {}).value || "";
    if (v === t.adminPin) { S.owners[t.id] = true; saveDB(); render(); toast("Modo admin"); return; }
    const j = (t.judges || []).find(x => x.pin === v);
    if (j) { S.ui.judge = j.id; S.ui.judgeT = t.id; render(); toast("Hola, " + j.name); return; }
    toast("PIN incorrecto"); return;
  }
  if (act === "start") {
    const n = rosterOf(t).length;
    const fuera = t.players.length - n;
    if (n < 2) return toast("Necesitás al menos 2 jugadores con check-in");
    if (t.poolCount > 1 && n >= 4) {
      buildPools(t);
      t.phase = "pools";
      S.ui.tab = "pools";
      touch(t); render();
      toast(`Grupos sorteados${fuera > 0 ? ` · ${fuera} sin check-in quedaron afuera` : ""}`);
      return;
    }
    t.size = nextPow2(n);
    if (rosterOf(t).length < 3) t.format = "single";
    t.phase = "running"; t.results = {}; S.ui.tab = "bracket";
    touch(t); render();
    toast(fuera > 0 ? `Llaves generadas · ${fuera} sin check-in quedaron afuera` : "Llaves generadas");
    return;
  }
  if (act === "edit") { openEdit(t); return; }
  if (act === "closepools") {
    const st = poolsStats(t);
    if (!st.done && !confirm(`Quedan ${st.total - st.played} partidas sin jugar. ¿Cerrar igual con la tabla actual?`)) return;
    if (t.pools.groups.every(g => standings(t, g).filter(r => r.w + r.l > 0).length === 0)) return toast("Jugá al menos una partida");
    closePools(t); touch(t); render(); toast("Bracket generado");
    return;
  }
  if (act === "poolmatch") { openPoolMatch(t, el.dataset.id); return; }
  if (act === "poolwin") {
    const need = Math.ceil((t.bestOf || 3) / 2);
    t.poolResults[el.dataset.id] = el.dataset.side === "a" ? [need, 0] : [0, need];
    touch(t); closeModal(); render();
    toast(poolsStats(t).done ? "Grupos completos · ya podés armar el bracket" : "Resultado guardado");
    return;
  }
  if (act === "poolsave") {
    const a = $("#modal [data-pscore='a']").value, b = $("#modal [data-pscore='b']").value;
    if (a === "" || b === "") return toast("Completá ambos marcadores");
    if (+a === +b) return toast("No puede haber empate en un pool");
    t.poolResults[el.dataset.id] = [+a, +b];
    touch(t); closeModal(); render();
    toast(poolsStats(t).done ? "Grupos completos · ya podés armar el bracket" : "Resultado guardado");
    return;
  }
  if (act === "poolclear") {
    delete t.poolResults[el.dataset.id]; touch(t); closeModal(); render(); return;
  }
  if (act === "close") { closeModal(); return; }
  if (act === "checkin") {
    const p = t.players.find(x => x.id === el.dataset.id);
    p.in = p.in === true ? false : true; touch(t); render(); return;
  }
  if (act === "allin") { t.players.forEach(p => p.in = true); touch(t); render(); return; }
  if (act === "autoseed") { seedApply(t, false); return; }
  if (act === "shuffleseed") { seedApply(t, true); return; }
  if (act === "delp") {
    t.players = t.players.filter(p => p.id !== el.dataset.id); touch(t); render(); return;
  }
  if (act === "deljudge") {
    t.judges = (t.judges || []).filter(j => j.id !== el.dataset.id); touch(t); render(); return;
  }
  if (act === "match") { openMatch(t, el.dataset.id); return; }
  if (act === "quickwin") {
    const need = Math.ceil((t.bestOf || 3) / 2);
    t.results[el.dataset.id] = el.dataset.side === "a" ? [need, 0] : [0, need];
    if (t.stream === el.dataset.id) t.stream = null;
    settle(t); touch(t); closeModal(); render(); toast("Resultado guardado");
    return;
  }
  if (act === "resetbracket") {
    if (!confirm("¿Borrar todos los resultados y volver a empezar las llaves?")) return;
    t.results = {}; t.stream = null; settle(t); touch(t); render(); return;
  }
  if (act === "stream") {
    t.stream = t.stream === el.dataset.id ? null : el.dataset.id;
    touch(t); closeModal(); render(); toast(t.stream ? "Partida marcada para stream" : "Stream liberado"); return;
  }
  if (act === "spin") { spin(t); return; }
  if (act === "assignall") { assignAll(t); return; }
});

/* tras cargar o borrar un resultado: ¿terminó el torneo? */
function settle(t) {
  const { champ } = computeBracket(t);
  t.phase = champ ? "done" : "running";
}

function seedApply(t, shuffle) {  let arr = t.players.slice();
  if (shuffle) arr = arr.sort(() => Math.random() - .5);
  arr.forEach((p, i) => { p.seed = i + 1; });
  touch(t); render(); toast(shuffle ? "Siembra aleatoria" : "Siembra por orden de lista");
}

/* ---------------- modal de partida ---------------- */
function closeModal() { $("#modal").innerHTML = ""; }
function wireModal() {
  const back = $("#modal .modal");
  if (back) back.addEventListener("click", (ev) => { if (ev.target === back) closeModal(); });
}
function openMatch(t, id) {
  const { B } = computeBracket(t);
  const m = B.matches[id];
  if (!m) return;
  const nm = (p) => p === BYE ? "BYE" : p ? pidName(t, p) : "Por definir";
  const locked = !m.a || !m.b || m.a === BYE || m.b === BYE;
  $("#modal").innerHTML = `
  <div class="modal">
    <div class="box" data-stop>
      <div class="row" style="justify-content:space-between"><span class="label">${matchLabel(m)}</span>
        ${m.done ? `<span class="badge ok">Finalizada</span>` : `<span class="badge">Pendiente</span>`}</div>
      <div class="grid" style="gap:.7rem;margin-top:.8rem">
        ${locked ? "" : `<div class="row" style="gap:.5rem">
          <button class="btn sm p" data-act="quickwin" data-id="${id}" data-side="a" style="flex:1">Gana ${esc(nm(m.a))}</button>
          <button class="btn sm p" data-act="quickwin" data-id="${id}" data-side="b" style="flex:1">Gana ${esc(nm(m.b))}</button>
        </div>`}
        ${[["a", m.a, m.sa], ["b", m.b, m.sb]].map(([k, p, sc]) => `
          <div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:.55rem .7rem">
            <div><b>${esc(nm(p))}</b><div class="tiny muted">${esc(p && p !== BYE ? pidChar(t, p) : "")}</div></div>
            <input type="number" min="0" max="9" value="${m.done ? sc : ""}" data-score="${k}" style="width:64px;text-align:center" ${locked ? "disabled" : ""}>
          </div>`).join("")}
        <div class="tiny muted">El ganador es quien tenga más sets. En doble eliminación el perdedor baja a Losers.</div>
        <div class="row">
          <button class="btn p" data-act="save" data-id="${id}" ${locked ? "disabled" : ""}>Guardar resultado</button>
          <button class="btn g" data-act="stream" data-id="${id}">📺 ${t.stream === id ? "Quitar del stream" : "Al stream"}</button>
          ${m.done ? `<button class="btn g danger" data-act="clear" data-id="${id}">Borrar resultado</button>` : ""}
        </div>
      </div>
    </div>
  </div>`;
  wireModal();
  $("#modal").querySelector("[data-act='save']")?.addEventListener("click", () => {
    const a = $("#modal [data-score='a']").value;
    const b = $("#modal [data-score='b']").value;
    if (a === "" || b === "") return toast("Completá ambos marcadores");
    if (+a === +b) return toast("No puede haber empate");
    t.results[id] = [+a, +b];
    if (t.stream === id) t.stream = null;
    settle(t); touch(t); closeModal(); render(); toast("Resultado guardado");
  });
  $("#modal").querySelector("[data-act='clear']")?.addEventListener("click", () => {
    delete t.results[id]; settle(t); touch(t); closeModal(); render();
  });
}

  if (!t.pools) return;
  const g = t.pools.groups.find(x => (x.matches || []).some(m => m.id === id));
  if (!g) return;
  const m = g.matches.find(x => x.id === id);
  const res = t.poolResults[id];
  const nm = (p) => pidName(t, p);
  $("#modal").innerHTML = `
  <div class="modal">
    <div class="box">
      <div class="row" style="justify-content:space-between">
        <span class="label">${esc(g.name)}</span>
        ${res ? `<span class="badge ok">${res[0]} – ${res[1]}</span>` : `<span class="badge">Pendiente</span>`}
      </div>
      <div class="grid" style="gap:.7rem;margin-top:.8rem">
        <div class="row" style="gap:.5rem">
          <button class="btn sm p" style="flex:1" data-act="poolwin" data-id="${id}" data-side="a">Gana ${esc(nm(m.a))}</button>
          <button class="btn sm p" style="flex:1" data-act="poolwin" data-id="${id}" data-side="b">Gana ${esc(nm(m.b))}</button>
        </div>
        <div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:.55rem .7rem">
          <b>${esc(nm(m.a))}</b>
          <input type="number" min="0" max="9" value="${res ? res[0] : ""}" data-pscore="a" style="width:64px;text-align:center">
        </div>
        <div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:.55rem .7rem">
          <b>${esc(nm(m.b))}</b>
          <input type="number" min="0" max="9" value="${res ? res[1] : ""}" data-pscore="b" style="width:64px;text-align:center">
        </div>
        <div class="row">
          <button class="btn p" data-act="poolsave" data-id="${id}">Guardar marcador</button>
          ${res ? `<button class="btn g danger" data-act="poolclear" data-id="${id}">Borrar</button>` : ""}
        </div>
        <div class="tiny muted">Gana quien llegue a ${Math.ceil((t.bestOf || 3) / 2)} sets.</div>
      </div>
    </div>
  </div>`;
  wireModal();
}

/* ---------------- ruleta ---------------- */
let spinning = false;
function spin(t) {
  const chars = (t.chars || []).length ? t.chars : ["Ryu", "Ken", "Chun-Li", "Cammy", "Guile", "Juri", "Zangief", "Dhalsim"];
  const el = $("#spin");
  if (!el || spinning) return;
  spinning = true;
  el.className = "spin-name go";
  let i = 0, delay = 45, total = 0;
  const step = () => {
    el.textContent = chars[Math.floor(Math.random() * chars.length)];
    total++;
    if (total > 26) delay *= 1.18;
    if (delay > 320) {
      const win = chars[Math.floor(Math.random() * chars.length)];
      el.textContent = win;
      el.className = "spin-name done flash";
      spinning = false;
      return;
    }
    setTimeout(step, delay);
  };
  step();
}
function assignAll(t) {
  const chars = (t.chars || []).length ? t.chars : ["Ryu", "Ken", "Chun-Li", "Cammy", "Guile", "Juri"];
  const ps = t.players.slice();
  const pool = [];
  while (pool.length < ps.length) pool.push(...chars.slice().sort(() => Math.random() - .5));
  ps.forEach((p, i) => { p.char = pool[i]; });
  touch(t); render(); toast("Personajes asignados");
}

/* ---------------- sync (Supabase REST, opcional) ---------------- */
function cfgOK() { return !!(S.cfg.url && S.cfg.key); }
function headers() {
  return { apikey: S.cfg.key, Authorization: "Bearer " + S.cfg.key, "Content-Type": "application/json" };
}
async function pushRemote(t) {
  if (!cfgOK() || !t) return;
  try {
    await fetch(S.cfg.url + "/rest/v1/tournaments?on_conflict=id", {
      method: "POST",
      headers: Object.assign(headers(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ id: t.id, data: t, updated_at: new Date().toISOString() }]),
    });
  } catch (e) { /* offline: seguimos local */ }
}
let pulling = false;
async function pullRemote(manual) {
  if (!cfgOK() || pulling) return;
  pulling = true;
  try {
    const res = await fetch(S.cfg.url + "/rest/v1/tournaments?select=id,data,updated_at", { headers: headers() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    let changed = false;
    for (const row of rows) {
      const remote = row.data;
      const local = S.t[row.id];
      if (!remote || !remote.id) continue;
      if (remote.deleted) {
        if (local) { delete S.t[row.id]; delete S.owners[row.id]; changed = true; }
        continue;
      }
      if (!local || (remote.updatedAt || 0) > (local.updatedAt || 0)) { S.t[row.id] = remote; changed = true; }
    }
    if (changed) { saveDB(); render(); }
    if (manual) toast("Sincronizado · " + rows.length + " torneos");
  } catch (e) { if (manual) toast("No se pudo sincronizar: " + e.message); }
  finally { pulling = false; }
}
setInterval(() => pullRemote(false), 4000);
window.addEventListener("storage", (e) => { if (e.key === KEY) { S = loadDB(); render(); } });

/* ============================================================
   AUTO-TEST  (#/test)
   ============================================================ */
function renderTest() {
  const out = runTests();
  $("#app").innerHTML = `<h1 style="font-size:1.3rem">Auto-test del motor</h1>
  <div class="card" style="margin-top:.8rem"><pre style="margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace">${esc(out.join("\n"))}</pre></div>`;
}
function runTests() {
  const out = [];
  let pass = 0, fail = 0;
  const ok = (c, msg) => { if (c) { pass++; } else { fail++; out.push("FALLA: " + msg); } };

  for (const size of [4, 8, 16, 32, 64]) {
    for (const format of ["single", "double"]) {
      const t = {
        id: "test", format, size, bestOf: 3, results: {}, players: [],
        chars: [], judges: [],
      };
      const n = format === "single" ? size : size; // lleno
      for (let i = 0; i < n; i++) t.players.push({ id: "p" + i, name: "P" + i, seed: i + 1, in: true, createdAt: i });

      let { B } = computeBracket(t);
      let guard = 0;
      while (guard++ < 5000) {
        const p = playable(B);
        if (!p.length) break;
        const m = p[Math.floor(Math.random() * p.length)];
        t.results[m.id] = Math.random() < .5 ? [3, 0] : [3, 2];
        ({ B } = computeBracket(t));
      }
      const res = computeBracket(t);
      ok(!!res.champ, `${format} ${size}: sin campeón`);
      ok(guard < 5000, `${format} ${size}: no termina`);
      const losses = res.losses;
      if (format === "double") {
        const bad = Object.entries(losses).filter(([, v]) => v > 2);
        ok(!bad.length, `double ${size}: alguien perdió ${bad[0] && bad[0][1]} veces`);
        const champ = res.champ;
        ok((losses[champ] || 0) <= 1, `double ${size}: campeón con 2 derrotas`);
      } else {
        const oneLoss = Object.values(losses).filter(v => v === 1).length;
        ok(oneLoss === size - 1, `single ${size}: eliminados=${oneLoss}, esperado ${size - 1}`);
      }
      const total = Object.values(B.matches).filter(m => m.done && m.a !== BYE && m.b !== BYE).length;
      out.push(`${format.padEnd(6)} ${String(size).padStart(3)} → campeón ${res.champ ? "sí" : "no"}, partidas jugadas ${total}, pendientes ${playable(B).length}`);
    }
  }
  // bracket incompleto (byes)
  for (const n of [3, 5, 6, 11]) {
    const t = { id: "x", format: "double", size: nextPow2(n), bestOf: 3, results: {}, players: [], chars: [], judges: [] };
    for (let i = 0; i < n; i++) t.players.push({ id: "q" + i, name: "Q" + i, seed: i + 1, in: true, createdAt: i });
    let { B } = computeBracket(t);
    let guard = 0;
    while (guard++ < 5000) {
      const p = playable(B); if (!p.length) break;
      const m = p[Math.floor(Math.random() * p.length)];
      t.results[m.id] = [3, 1];
      ({ B } = computeBracket(t));
    }
    const r = computeBracket(t);
    ok(!!r.champ, `byes ${n}: sin campeón`);
    out.push(`byes   ${String(n).padStart(3)} → campeón ${r.champ ? "sí" : "no"}, pendientes ${playable(B).length}`);
  }
  // GF reset
  {
    const t = { id: "g", format: "double", size: 4, bestOf: 3, results: {}, players: [], chars: [], judges: [] };
    for (let i = 0; i < 4; i++) t.players.push({ id: "g" + i, name: "G" + i, seed: i + 1, in: true, createdAt: i });
    let { B } = computeBracket(t);
    let guard = 0;
    while (guard++ < 500) {
      const p = playable(B); if (!p.length) break;
      const m = p[0];
      // forzar que el de losers gane la GF0
      const g = m.id === "GF-0";
      t.results[m.id] = g ? [1, 3] : [3, 0];
      ({ B } = computeBracket(t));
    }
    const r = computeBracket(t);
    ok(!!r.B.matches["GF-1"], "reset: no se creó la segunda final");
    ok(!!r.champ, "reset: sin campeón");
    if (r.B.matches["GF-1"]) ok(r.B.matches["GF-1"].done, "reset: GF-1 sin jugar");
    out.push("grand final reset → " + (r.B.matches["GF-1"] ? "GF-1 jugada" : "no aplicó"));
  }

  out.push("");
  out.push(`RESULTADO: ${pass} OK · ${fail} fallas`);
  return out;
}

/* ---------------- boot ---------------- */
window.addEventListener("load", () => { render(); pullRemote(false); });
render();
